<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সকল নোটিশ | ফুলবাড়ীয়া কলেজ</title>
<meta name="description" content="ফুলবাড়ীয়া কলেজের সকল নোটিশ ও ঘোষণা">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --navy-3: #0d47a1;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --white: #ffffff;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --grey-light: #9ca3af;
    --dark: #1f2937;
    --border: rgba(0,0,0,0.08);
    --border-light: rgba(0,0,0,0.04);
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
    --shadow-md: 0 4px 16px rgba(10,22,85,0.08);
    --shadow-lg: 0 12px 40px rgba(10,22,85,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
    font-family: 'Hind Siliguri', sans-serif;
    background: var(--off-white);
    color: var(--dark);
    line-height: 1.6;
}
a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

.container-custom {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px;
}

/* =========================================================
   HEADER (Simple, clean)
========================================================= */
.main-header {
    background: #fff;
    padding: 12px 0;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 900;
    border-bottom: 1px solid var(--border-light);
}
.main-header .container-custom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
}
.logo-box {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}
.logo-box img {
    width: 46px;
    height: 46px;
    object-fit: contain;
    border-radius: 10px;
    background: var(--off-white);
    padding: 3px;
    flex-shrink: 0;
}
.logo-box .logo-text {
    min-width: 0;
}
.logo-box .logo-text h1 {
    font-size: 17px;
    color: var(--navy);
    margin: 0;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.logo-box .logo-text p {
    font-size: 10px;
    color: var(--grey-light);
    margin: 2px 0 0;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
}

.home-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-radius: 50px;
    font-weight: 600;
    font-size: 13px;
    transition: 0.3s;
    box-shadow: 0 4px 12px rgba(10,22,85,0.2);
    flex-shrink: 0;
}
.home-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(10,22,85,0.35);
    color: #fff;
}
.home-btn i { color: var(--gold); font-size: 12px; }

/* =========================================================
   PAGE HERO (Compact)
========================================================= */
.page-hero {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 32px 0 70px;
    position: relative;
    overflow: hidden;
}
.page-hero::before {
    content: '';
    position: absolute;
    top: -60%; right: -15%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(242,210,123,0.12), transparent 65%);
    border-radius: 50%;
}
.page-hero .container-custom {
    position: relative;
    z-index: 1;
    text-align: center;
}
.page-hero .hero-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 14px;
    border: 1px solid rgba(242,210,123,0.3);
}
.page-hero h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
}
.page-hero h1 span { color: var(--gold); }
.page-hero p {
    font-size: 13.5px;
    opacity: 0.85;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.6;
}

/* =========================================================
   MAIN
========================================================= */
.main-content {
    padding: 0 0 70px;
    margin-top: -40px;
    position: relative;
    z-index: 2;
}

/* =========================================================
   COMPACT STATS (Inline pills)
========================================================= */
.stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}
.stat-pill {
    flex: 1;
    min-width: 130px;
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    transition: 0.3s;
}
.stat-pill:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}
.stat-pill .sp-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
}
.stat-pill .sp-icon.navy {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: var(--gold);
}
.stat-pill .sp-icon.gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
}
.stat-pill .sp-icon.red {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
}
.stat-pill .sp-info { flex: 1; min-width: 0; }
.stat-pill .sp-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.stat-pill .sp-label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 3px;
}

/* =========================================================
   TOOLBAR (Filter + Search combined)
========================================================= */
.toolbar {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    margin-bottom: 18px;
}

.filter-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
}
.filter-scroll::-webkit-scrollbar { display: none; }

.filter-chip {
    padding: 8px 15px;
    border-radius: 50px;
    border: 1.5px solid #e5e7eb;
    background: #fff;
    color: var(--grey);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    flex-shrink: 0;
}
.filter-chip:hover {
    border-color: var(--navy);
    color: var(--navy);
}
.filter-chip.active {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(10,22,85,0.2);
}
.filter-chip i { font-size: 10px; }

.search-wrap {
    position: relative;
}
.search-wrap i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--grey-light);
    font-size: 13px;
    pointer-events: none;
}
.search-input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    border-radius: 50px;
    border: 1.5px solid #e5e7eb;
    background: var(--off-white);
    font-size: 13px;
    transition: 0.25s;
    outline: none;
    color: var(--dark);
}
.search-input::placeholder { color: var(--grey-light); }
.search-input:focus {
    border-color: var(--navy);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(10,22,85,0.06);
}

/* =========================================================
   NOTICE GRID
========================================================= */
.notices-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
}

.notice-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: all 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    border: 1px solid var(--border-light);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
    animation: cardFadeIn 0.5s ease both;
}

@keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.notice-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: rgba(10,22,85,0.12);
    color: inherit;
}

.notice-card .accent-bar {
    height: 3px;
    background: linear-gradient(90deg, var(--navy), var(--gold));
    opacity: 0;
    transition: 0.3s;
}
.notice-card:hover .accent-bar { opacity: 1; }

.notice-card .card-inner {
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

/* Card Top Row */
.card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.card-cat {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: linear-gradient(135deg, rgba(10,22,85,0.08), rgba(13,71,161,0.06));
    color: var(--navy);
    border: 1px solid rgba(10,22,85,0.1);
}
.card-cat i { font-size: 9px; }

.card-badges {
    display: inline-flex;
    gap: 4px;
}
.card-badge-star {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    box-shadow: 0 2px 6px rgba(242,210,123,0.4);
}
.card-badge-important {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    box-shadow: 0 2px 6px rgba(239,68,68,0.4);
}

/* Card Title */
.notice-card h4 {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.45;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 45px;
}

/* Card Description */
.notice-card p {
    font-size: 12.5px;
    color: var(--grey);
    line-height: 1.65;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
}

/* Card Footer */
.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
    gap: 8px;
}

.card-date {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--grey);
    font-weight: 500;
}
.card-date i {
    color: var(--gold-dark);
    font-size: 11px;
}

.card-arrow {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--off-white);
    color: var(--navy);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: 0.3s;
    flex-shrink: 0;
}
.notice-card:hover .card-arrow {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: var(--gold);
    transform: translateX(3px);
}

/* File Indicator */
.card-file {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 600;
    color: #dc2626;
    background: #fef2f2;
    padding: 2px 8px;
    border-radius: 50px;
    border: 1px solid rgba(239,68,68,0.15);
}
.card-file i { font-size: 9px; }

/* Featured/important card accent */
.notice-card.is-featured {
    border-color: rgba(242,210,123,0.4);
}
.notice-card.is-featured .accent-bar {
    opacity: 1;
    background: linear-gradient(90deg, var(--gold), var(--gold-2), var(--gold));
}
.notice-card.is-important {
    border-color: rgba(239,68,68,0.25);
}
.notice-card.is-important .accent-bar {
    opacity: 1;
    background: linear-gradient(90deg, #ef4444, #dc2626);
}

/* =========================================================
   SKELETON
========================================================= */
.skeleton-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border-light);
    padding: 18px;
}
.sk-line {
    border-radius: 6px;
    background: linear-gradient(90deg, #f0f2f5 25%, #e5e7eb 50%, #f0f2f5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    margin-bottom: 10px;
    height: 12px;
}
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* =========================================================
   EMPTY STATE
========================================================= */
.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-sm);
}
.empty-state .empty-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, rgba(10,22,85,0.05), rgba(13,71,161,0.03));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--navy);
    opacity: 0.6;
    margin-bottom: 16px;
}
.empty-state h3 {
    font-size: 17px;
    color: var(--navy);
    margin-bottom: 6px;
    font-weight: 700;
}
.empty-state p {
    font-size: 13px;
    color: var(--grey);
    margin-bottom: 18px;
}
.empty-state .clear-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-radius: 50px;
    font-weight: 600;
    font-size: 12.5px;
    border: none;
    transition: 0.3s;
    box-shadow: 0 4px 14px rgba(10,22,85,0.25);
}
.empty-state .clear-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(10,22,85,0.35);
}

/* =========================================================
   FOOTER
========================================================= */
.page-footer {
    background: linear-gradient(135deg, #061040, var(--navy));
    color: rgba(255,255,255,0.85);
    padding: 30px 0 20px;
    margin-top: 40px;
}
.page-footer .footer-content {
    text-align: center;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.page-footer h3 {
    font-size: 18px;
    color: #fff;
    margin-bottom: 6px;
    font-family: 'Playfair Display', serif;
}
.page-footer h3 span { color: var(--gold); }
.page-footer p { font-size: 12.5px; opacity: 0.75; }
.page-footer .footer-bottom {
    text-align: center;
    padding: 16px 0 0;
    font-size: 11.5px;
    color: rgba(255,255,255,0.55);
}
.page-footer .footer-bottom strong { color: var(--gold); }

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 768px) {
    .container-custom { padding: 0 14px; }

    .logo-box img { width: 42px; height: 42px; }
    .logo-box .logo-text h1 { font-size: 15px; }
    .logo-box .logo-text p { font-size: 9px; }
    .home-btn { padding: 8px 14px; font-size: 12px; }
    .home-btn span { display: none; }

    .page-hero { padding: 28px 0 60px; }
    .page-hero .hero-icon { width: 48px; height: 48px; font-size: 19px; margin-bottom: 10px; }
    .page-hero h1 { font-size: 20px; }
    .page-hero p { font-size: 12.5px; }

    .main-content { margin-top: -35px; }

    .stats-row { gap: 8px; margin-bottom: 14px; }
    .stat-pill {
        min-width: calc(50% - 4px);
        padding: 11px 12px;
        gap: 9px;
        border-radius: 12px;
    }
    .stat-pill .sp-icon { width: 34px; height: 34px; font-size: 14px; border-radius: 9px; }
    .stat-pill .sp-value { font-size: 17px; }
    .stat-pill .sp-label { font-size: 9.5px; }

    .toolbar { padding: 12px; border-radius: 14px; }
    .filter-chip { padding: 7px 13px; font-size: 11.5px; }
    .search-input { padding: 10px 14px 10px 38px; font-size: 12.5px; }

    .notices-grid { grid-template-columns: 1fr; gap: 12px; }
    .notice-card .card-inner { padding: 16px 16px 14px; }
    .notice-card h4 { font-size: 15px; min-height: unset; }
    .notice-card p { font-size: 12px; }
}

@media (max-width: 400px) {
    .stat-pill { min-width: 100%; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="main-header">
    <div class="container-custom">
        <a href="../index.html" class="logo-box">
            <img src="../assets/icons/logo.png" alt="Logo" onerror="this.style.display='none'">
            <div class="logo-text">
                <h1 data-college-name>ফুলবাড়ীয়া কলেজ</h1>
                <p>Fulbariya College</p>
            </div>
        </a>
        <a href="../index.html" class="home-btn">
            <i class="fas fa-home"></i> <span>হোম</span>
        </a>
    </div>
</header>

<!-- PAGE HERO -->
<section class="page-hero">
    <div class="container-custom">
        <div class="hero-icon">
            <i class="fas fa-clipboard-list"></i>
        </div>
        <h1>সকল <span>নোটিশ</span></h1>
        <p>কলেজের সকল ঘোষণা, একাডেমিক আপডেট ও প্রয়োজনীয় তথ্য এক জায়গায়</p>
    </div>
</section>

<!-- MAIN -->
<div class="main-content">
    <div class="container-custom">

        <!-- STATS PILLS -->
        <div class="stats-row">
            <div class="stat-pill">
                <div class="sp-icon navy"><i class="fas fa-bullhorn"></i></div>
                <div class="sp-info">
                    <div class="sp-value" id="statTotal">0</div>
                    <div class="sp-label">মোট নোটিশ</div>
                </div>
            </div>
            <div class="stat-pill">
                <div class="sp-icon gold"><i class="fas fa-star"></i></div>
                <div class="sp-info">
                    <div class="sp-value" id="statFeatured">0</div>
                    <div class="sp-label">Featured</div>
                </div>
            </div>
            <div class="stat-pill">
                <div class="sp-icon red"><i class="fas fa-exclamation"></i></div>
                <div class="sp-info">
                    <div class="sp-value" id="statImportant">0</div>
                    <div class="sp-label">জরুরি</div>
                </div>
            </div>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="filter-scroll">
                <button class="filter-chip active" data-filter="all">
                    <i class="fas fa-list"></i> সব
                </button>
                <button class="filter-chip" data-filter="general">
                    <i class="fas fa-info-circle"></i> সাধারণ
                </button>
                <button class="filter-chip" data-filter="academic">
                    <i class="fas fa-book"></i> একাডেমিক
                </button>
                <button class="filter-chip" data-filter="exam">
                    <i class="fas fa-file-alt"></i> পরীক্ষা
                </button>
                <button class="filter-chip" data-filter="admission">
                    <i class="fas fa-user-plus"></i> ভর্তি
                </button>
                <button class="filter-chip" data-filter="event">
                    <i class="fas fa-calendar-alt"></i> ইভেন্ট
                </button>
                <button class="filter-chip" data-filter="result">
                    <i class="fas fa-trophy"></i> ফলাফল
                </button>
                <button class="filter-chip" data-filter="important">
                    <i class="fas fa-exclamation-triangle"></i> জরুরি
                </button>
            </div>
            <div class="search-wrap">
                <i class="fas fa-search"></i>

        <div class="notices-grid" id="noticesGrid">

            <div class="skeleton-card">

        <div class="footer-content">
            <h3><span data-college-name>ফুলবাড়ীয়া কলেজ</span></h3>
            <p>শিক্ষা, নৈতিকতা ও আধুনিকতার সমন্বয়ে একটি আদর্শ শিক্ষা প্রতিষ্ঠান</p>
        </div>
        <div class="footer-bottom">
            © <span id="year"></span> <strong data-college-name>ফুলবাড়ীয়া কলেজ</strong>। সর্বস্বত্ব সংরক্ষিত।
        </div>
    </div>

<!-- SCROLL RESTORE -->
<script src="../js/scroll-restore.js"></script>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>

<script>
(function () {
    "use strict";

    let ALL_NOTICES = [];
    let currentFilter = 'all';
    let searchQuery = '';

    const grid = document.getElementById('noticesGrid');

    // =========================================================
    // HELPERS
    // =========================================================
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getFileType(url) {
        if (!url) return null;
        const lower = url.toLowerCase().split('?')[0];
        if (lower.endsWith('.pdf')) return 'pdf';
        if (lower.match(/\.(jpg|jpeg|png|gif|webp|bmp)$/)) return 'image';
        return null;
    }

    function getCategoryLabel(cat) {
        const labels = {
            general: 'সাধারণ',
            academic: 'একাডেমিক',
            exam: 'পরীক্ষা',
            admission: 'ভর্তি',
            event: 'ইভেন্ট',
            result: 'ফলাফল',
            notice: 'নোটিশ',
            important: 'গুরুত্বপূর্ণ'
        };
        return labels[cat] || cat;
    }

    function formatDateShort(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr);
            return d.toLocaleDateString('bn-BD', {
                day: 'numeric', month: 'short', year: 'numeric'
            });
        } catch (e) { return dateStr; }
    }

    // =========================================================
    // ENSURE SUPABASE
    // =========================================================
    async function ensureSupabase() {
        if (window.FDC_SUPABASE) return window.FDC_SUPABASE;

        if (!window.FDC_SUPABASE_READY) {
            await new Promise(r => {
                const t = setTimeout(r, 5000);
                document.addEventListener('fdc:supabase-ready', () => {
                    clearTimeout(t); r();
                }, { once: true });
            });
        }

        if (window.FDC_SUPABASE) return window.FDC_SUPABASE;

        if (!window.FDC_CONFIG || !window.FDC_CONFIG.SUPABASE_URL) {
            throw new Error('Config missing');
        }
        if (typeof window.supabase === 'undefined') {
            throw new Error('Supabase library not loaded');
        }

        const client = window.supabase.createClient(
            window.FDC_CONFIG.SUPABASE_URL,
            window.FDC_CONFIG.SUPABASE_PUBLISHABLE_KEY
        );
        window.FDC_SUPABASE = client;
        return client;
    }

    // =========================================================
    // LOAD COLLEGE INFO
    // =========================================================
    async function loadCollegeInfo() {
        try {
            const supabase = await ensureSupabase();
            const { data } = await supabase
                .from('site_settings')
                .select('key, value')
                .in('key', ['college_name']);

            const settings = {};
            (data || []).forEach(item => { settings[item.key] = item.value; });

            if (settings.college_name) {
                document.querySelectorAll('[data-college-name]').forEach(el => {
                    el.textContent = settings.college_name;
                });
                document.title = 'সকল নোটিশ | ' + settings.college_name;
            }
        } catch (e) {
            console.warn('College info load failed:', e);
        }
    }

    // =========================================================
    // LOAD NOTICES (image_url ছাড়াই)
    // =========================================================
    async function loadNotices() {
        try {
            const supabase = await ensureSupabase();

            const { data, error } = await supabase
                .from('notices')
                .select('id, title, description, date, category, file_url, is_featured, is_important')
                .eq('is_published', true)
                .order('is_important', { ascending: false })
                .order('is_featured', { ascending: false })
                .order('date', { ascending: false });

            if (error) throw error;

            ALL_NOTICES = data || [];
            updateStats();
            renderNotices();

        } catch (err) {
            console.error('❌ Notices load error:', err);
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <h3>নোটিশ লোড করা যায়নি</h3>
                    <p>${escapeHtml(err.message)}</p>
                    <button class="clear-btn" onclick="location.reload()">
                        <i class="fas fa-redo"></i> আবার চেষ্টা করুন
                    </button>
                </div>
            `;
        }
    }

    // =========================================================
    // UPDATE STATS
    // =========================================================
    function updateStats() {
        const total = ALL_NOTICES.length;
        const featured = ALL_NOTICES.filter(n => n.is_featured).length;
        const important = ALL_NOTICES.filter(n => n.is_important).length;

        animateNumber('statTotal', total);
        animateNumber('statFeatured', featured);
        animateNumber('statImportant', important);
    }

    function animateNumber(id, target) {
        const el = document.getElementById(id);
        if (!el) return;
        const duration = 600;
        const startTime = performance.now();

        function update(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            el.textContent = Math.floor(target * progress);
            if (progress < 1) requestAnimationFrame(update);
            else el.textContent = target;
        }
        requestAnimationFrame(update);
    }

    // =========================================================
    // RENDER NOTICES
    // =========================================================
    function renderNotices() {
        let filtered = ALL_NOTICES.filter(n => {
            if (currentFilter === 'important') {
                if (!n.is_important) return false;
            } else if (currentFilter !== 'all') {
                if ((n.category || 'general') !== currentFilter) return false;
            }

            if (searchQuery) {
                const text = (
                    (n.title || '') + ' ' +
                    (n.description || '') + ' ' +
                    (n.category || '')
                ).toLowerCase();
                if (!text.includes(searchQuery)) return false;
            }

            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-inbox"></i></div>
                    <h3>কোনো নোটিশ পাওয়া যায়নি</h3>
                    <p>${searchQuery ? 'আপনার সার্চের সাথে মিলে এমন কোনো নোটিশ নেই' : 'এই বিভাগে এখনো কোনো নোটিশ যোগ করা হয়নি'}</p>
                    <button class="clear-btn" onclick="clearFilters()">
                        <i class="fas fa-times"></i> ফিল্টার রিসেট
                    </button>
                </div>
            `;
            return;
        }

        let html = '';
        filtered.forEach((n, idx) => {
            const categoryLabel = getCategoryLabel(n.category || 'general');
            const fileType = getFileType(n.file_url);
            const dateStr = formatDateShort(n.date);

            // Card classes
            const cardClasses = [
                'notice-card',
                n.is_featured ? 'is-featured' : '',
                n.is_important ? 'is-important' : ''
            ].filter(Boolean).join(' ');

            // Badges
            const badges = [];
            if (n.is_featured) {
                badges.push(`<span class="card-badge-star"><i class="fas fa-star"></i></span>`);
            }
            if (n.is_important) {
                badges.push(`<span class="card-badge-star card-badge-important"><i class="fas fa-exclamation"></i></span>`);
            }

            // File indicator
            let fileIndicator = '';
            if (n.file_url) {
                const icon = fileType === 'pdf' ? 'fa-file-pdf'
                            : fileType === 'image' ? 'fa-file-image'
                            : 'fa-paperclip';
                const label = fileType === 'pdf' ? 'PDF' : fileType === 'image' ? 'ছবি' : 'ফাইল';
                fileIndicator = `<span class="card-file"><i class="fas ${icon}"></i> ${label}</span>`;
            }

            const delay = Math.min(idx * 40, 400);

            html += `
                <a href="notice-details.html?id=${n.id}"
                   class="${cardClasses}"
                   style="animation-delay:${delay}ms;">
                    <div class="accent-bar"></div>
                    <div class="card-inner">
                        <div class="card-top">
                            <span class="card-cat">
                                <i class="fas fa-tag"></i> ${escapeHtml(categoryLabel)}
                            </span>
                            <span class="card-badges">${badges.join('')}</span>
                        </div>
                        <h4>${escapeHtml(n.title || 'Untitled')}</h4>
                        <p>${escapeHtml(n.description || 'বিস্তারিত দেখতে ক্লিক করুন...')}</p>
                        <div class="card-footer">
                            <span class="card-date">
                                <i class="fas fa-calendar-alt"></i> ${escapeHtml(dateStr)}
                            </span>
                            ${fileIndicator || '<span></span>'}
                            <span class="card-arrow">
                                <i class="fas fa-arrow-right"></i>
                            </span>
                        </div>
                    </div>
                </a>
            `;
        });

        grid.innerHTML = html;
    }

    // =========================================================
    // FILTER & SEARCH
    // =========================================================
    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', function () {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderNotices();
        });
    });

    document.getElementById('searchInput').addEventListener('input', function () {
        searchQuery = this.value.toLowerCase().trim();
        renderNotices();
    });

    window.clearFilters = function () {
        currentFilter = 'all';
        searchQuery = '';
        document.getElementById('searchInput').value = '';
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        const allChip = document.querySelector('.filter-chip[data-filter="all"]');
        if (allChip) allChip.classList.add('active');
        renderNotices();
    };

    // =========================================================
    // INIT
    // =========================================================
    async function init() {
        document.getElementById('year').textContent = new Date().getFullYear();
        await loadCollegeInfo();
        await loadNotices();
        console.log('✅ Notices page ready');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>

</body>
</html>
