<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Routine - Fulbariya College</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --dark: #1f2937;
    --red: #dc2626;
    --border: rgba(0,0,0,0.06);
    --border-light: rgba(0,0,0,0.04);
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
    --shadow-md: 0 4px 16px rgba(10,22,85,0.08);
    --shadow-lg: 0 12px 40px rgba(10,22,85,0.12);
}

* { font-family: 'Hind Siliguri', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--off-white); margin: 0; color: var(--dark); }

/* HEADER */
.public-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(10,22,85,0.2);
    flex-wrap: wrap;
    gap: 12px;
}
.public-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.public-header .brand { display: flex; align-items: center; gap: 12px; }
.public-header .brand-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 1px solid rgba(242,210,123,0.3);
}
.public-header h4 { margin: 0; font-size: 17px; font-weight: 700; }
.public-header small { font-size: 11px; opacity: 0.85; display: block; margin-top: 2px; }
.btn-header {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}
.btn-header:hover { background: rgba(255,255,255,0.25); color: #fff; transform: translateY(-1px); }

/* HERO */
.hero {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 36px 20px 70px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(239,68,68,0.15), transparent 70%);
    border-radius: 50%;
}
.hero-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
.hero .hero-icon {
    width: 70px; height: 70px;
    border-radius: 18px;
    background: rgba(239,68,68,0.2);
    color: #fca5a5;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    border: 2px solid rgba(239,68,68,0.3);
    margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(239,68,68,0.25);
}
.hero h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 8px;
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.3px;
    color: #fff;
}
.hero h1 span { color: #fca5a5; }
.hero p { font-size: 13.5px; opacity: 0.85; margin: 0; line-height: 1.6; }

/* MAIN */
.main-wrap {
    max-width: 1000px;
    margin: -45px auto 40px;
    padding: 0 16px;
    position: relative;
    z-index: 2;
}

/* FILTER CARD */
.filter-card {
    background: #fff;
    border-radius: 18px;
    padding: 18px 20px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    align-items: end;
}
.filter-card label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
    margin-bottom: 5px;
}
.filter-card select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    background: #fafbff;
    font-size: 13.5px;
    outline: none;
    transition: 0.25s;
    font-family: inherit;
    font-weight: 600;
    color: var(--navy);
}
.filter-card select:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.06);
    background: #fff;
}

/* STATS */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.stat-pill {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: 0.3s;
}
.stat-pill:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-pill .sp-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}
.stat-pill .sp-icon.exam { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
.stat-pill .sp-icon.branch { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--gold); }
.stat-pill .sp-icon.total { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #fff; }
.stat-pill .sp-info { min-width: 0; }
.stat-pill .sp-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.stat-pill .sp-label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
}

/* ROUTINES LIST */
.routines-list {
    display: grid;
    gap: 14px;
}

.routine-card {
    background: #fff;
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    display: flex;
    gap: 20px;
    align-items: flex-start;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}
.routine-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--red), #ef4444);
}
.routine-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
}

.routine-thumb {
    flex-shrink: 0;
    width: 110px;
    height: 110px;
    border-radius: 12px;
    overflow: hidden;
    background: #fef2f2;
    cursor: pointer;
    position: relative;
    border: 1px solid var(--border);
}
.routine-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
}
.routine-thumb:hover img { transform: scale(1.08); }
.routine-thumb .overlay {
    position: absolute;
    inset: 0;
    background: rgba(220,38,38,0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    opacity: 0;
    transition: 0.3s;
}
.routine-thumb:hover .overlay { opacity: 1; }

.routine-body { flex: 1; min-width: 0; }
.routine-body h4 {
    font-size: 16px;
    color: var(--navy);
    margin: 0 0 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    line-height: 1.35;
}
.routine-title {
    cursor: pointer;
    transition: 0.25s;
}
.routine-title:hover {
    color: var(--red);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
}
.routine-body p {
    font-size: 13px;
    color: var(--grey);
    margin: 0 0 10px;
    line-height: 1.6;
}
.routine-meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--grey);
    margin-bottom: 12px;
}
.routine-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.routine-meta i { color: var(--gold-dark); }

.exam-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #dc2626, #ef4444);
    color: #fff;
}

.branch-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
}
.branch-badge.HSC { background: #dbeafe; color: #1e40af; }
.branch-badge.BM { background: #f3e8ff; color: #6b21a8; }
.branch-badge.Honours { background: #fef3c7; color: #92400e; }
.branch-badge.Degree { background: #dcfce7; color: #166534; }

.routine-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
}
.btn-action {
    padding: 9px 16px;
    border-radius: 50px;
    border: none;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    font-family: inherit;
}
.btn-action.primary {
    background: linear-gradient(135deg, var(--red), #ef4444);
    color: #fff;
    box-shadow: 0 4px 12px rgba(220,38,38,0.25);
}
.btn-action.primary:hover { transform: translateY(-2px); color: #fff; box-shadow: 0 6px 20px rgba(220,38,38,0.35); }

.btn-action.gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    box-shadow: 0 4px 12px rgba(212,175,55,0.3);
}
.btn-action.gold:hover { transform: translateY(-2px); color: var(--navy); box-shadow: 0 6px 20px rgba(212,175,55,0.5); }

/* EMPTY STATE */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    background: #fff;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}
.empty-state .icon-wrap {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, rgba(220,38,38,0.08), rgba(239,68,68,0.04));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
}
.empty-state i { font-size: 36px; color: var(--red); opacity: 0.5; }
.empty-state h6 { color: #374151; font-weight: 700; font-size: 17px; margin-bottom: 8px; }
.empty-state p { font-size: 13.5px; color: var(--grey); margin: 0; }

/* LOADING */
.loading-card {
    background: #fff;
    border-radius: 20px;
    padding: 60px 20px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}
.loading-spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(10,22,85,0.1);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-card p { color: var(--grey); font-size: 13.5px; margin: 0; }

/* PREVIEW MODAL — Hybrid (Image + PDF) */
.preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 40, 0.92);
    backdrop-filter: blur(8px);
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.25s ease;
}
.preview-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.preview-box {
    max-width: 95vw;
    max-height: 90vh;
    position: relative;
    animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes zoomIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.preview-box img {
    max-width: 100%;
    max-height: 82vh;
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: block;
}
.preview-box iframe {
    width: 90vw;
    height: 82vh;
    max-width: 900px;
    border: none;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: block;
}
.preview-close {
    position: absolute;
    top: -50px;
    right: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
}
.preview-close:hover { background: #ef4444; transform: rotate(90deg); }

.preview-actions {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}
.preview-actions .btn-prev {
    padding: 10px 22px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    border: none;
    border-radius: 50px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: 0.25s;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(212,175,55,0.4);
    white-space: nowrap;
}
.preview-actions .btn-prev:hover { transform: translateY(-2px); color: var(--navy); box-shadow: 0 8px 24px rgba(212,175,55,0.6); }

.preview-actions .btn-prev.open-new {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    box-shadow: 0 4px 16px rgba(10,22,85,0.4);
}
.preview-actions .btn-prev.open-new:hover {
    color: #fff;
    box-shadow: 0 8px 24px rgba(10,22,85,0.6);
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 30px 20px 40px;
    color: var(--grey);
    font-size: 12px;
}
.footer i { color: var(--gold-2); }
.footer .footer-line {
    max-width: 400px;
    margin: 0 auto 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(10,22,85,0.15), transparent);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .public-header { padding: 10px 14px; }
    .public-header h4 { font-size: 14px; }
    .hero { padding: 28px 16px 60px; }
    .hero h1 { font-size: 21px; }
    .hero p { font-size: 12.5px; }
    .hero .hero-icon { width: 60px; height: 60px; font-size: 26px; }
    .main-wrap { margin-top: -40px; padding: 0 12px; }
    .filter-card { padding: 14px 16px; grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-pill { padding: 11px 13px; }
    .stat-pill .sp-icon { width: 34px; height: 34px; font-size: 14px; }
    .stat-pill .sp-value { font-size: 18px; }
    .routine-card { padding: 14px 16px; gap: 14px; flex-wrap: wrap; }
    .routine-thumb { width: 80px; height: 80px; }
    .routine-body h4 { font-size: 14px; }
    .preview-close { top: -44px; width: 38px; height: 38px; }
    .preview-actions { bottom: -55px; gap: 8px; }
    .preview-actions .btn-prev { padding: 9px 16px; font-size: 12px; }
    .preview-box iframe { width: 92vw; height: 78vh; }
}

@media (max-width: 480px) {
    .filter-card { grid-template-columns: 1fr; }
    .hero h1 { font-size: 18px; }
    .routine-thumb { width: 70px; height: 70px; }
    .btn-action { font-size: 11.5px; padding: 8px 12px; }
    .preview-actions { bottom: -100px; flex-direction: column; width: 100%; }
    .preview-actions .btn-prev { width: 100%; justify-content: center; }
    .preview-box iframe { width: 92vw; height: 70vh; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="public-header">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-file-alt"></i></div>
        <div>
            <h4>Exam Routine Board</h4>
            <small>পরীক্ষার রুটিন বোর্ড</small>
        </div>
    </div>
    <a href="../index.html" class="btn-header">
        <i class="fas fa-home"></i> <span>Home</span>
    </a>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <div class="hero-icon"><i class="fas fa-file-alt"></i></div>
        <h1>পরীক্ষার <span>রুটিন</span></h1>
        <p>১ম, ২য় সাময়িক, টেস্ট ও ফাইনাল পরীক্ষার রুটিন</p>
    </div>
</section>

<!-- MAIN -->
<div class="main-wrap">

    <!-- FILTER -->
    <div class="filter-card">
        <div>
            <label>Exam</label>
            <select id="filterExam">
                <option value="">All Exams</option>
                <option value="1st Terminal">১ম সাময়িক</option>
                <option value="2nd Terminal">২য় সাময়িক</option>
                <option value="Test">টেস্ট পরীক্ষা</option>
                <option value="Final">ফাইনাল পরীক্ষা</option>
            </select>
        </div>
        <div>
            <label>Branch</label>
            <select id="filterBranch">
                <option value="">All Branches</option>
                <option value="HSC">HSC</option>
                <option value="BM">BM (BMT)</option>
                <option value="Honours">Honours</option>
                <option value="Degree">Degree</option>
            </select>
        </div>
        <div>
            <label>Group / Department</label>
            <select id="filterGroup">
                <option value="">All Groups</option>
            </select>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
        <div class="stat-pill">
            <div class="sp-icon total"><i class="fas fa-file-alt"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statTotal">0</div>
                <div class="sp-label">Total</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon exam"><i class="fas fa-pen"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statExams">0</div>
                <div class="sp-label">Exam Types</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon branch"><i class="fas fa-layer-group"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statBranches">0</div>
                <div class="sp-label">Branches</div>
            </div>
        </div>
    </div>

    <!-- ROUTINES LIST -->
    <div class="routines-list" id="routinesList">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <p>পরীক্ষার রুটিন লোড হচ্ছে...</p>
        </div>
    </div>

</div>

<!-- PREVIEW MODAL — Hybrid (Image + PDF) -->
<div class="preview-overlay" id="previewOverlay">
    <div class="preview-box">
        <button class="preview-close" id="previewClose">
            <i class="fas fa-times"></i>
        </button>

        <!-- IMAGE VIEWER -->
        <img id="previewImg" src="" alt="Preview" style="display:none;">

        <!-- PDF VIEWER -->
        <iframe id="previewPdf"
                src=""
                title="PDF Preview"
                style="display:none;">
        </iframe>

        <div class="preview-actions">
            <a href="#" id="previewDownload" class="btn-prev" download target="_blank" rel="noopener">
                <i class="fas fa-download"></i> Download
            </a>
            <a href="#" id="previewOpenNew" class="btn-prev open-new" target="_blank" rel="noopener">
                <i class="fas fa-external-link-alt"></i> Open in New Tab
            </a>
        </div>
    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-line"></div>
    <p><i class="fas fa-graduation-cap"></i> Fulbariya College · Exam Routine Board</p>
