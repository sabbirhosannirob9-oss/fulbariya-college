<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Application | ফুলবাড়ীয়া কলেজ</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --grey: #6b7280;
    --dark: #1f2937;
    --danger: #ef4444;
    --red-print: #8c1414;
    --red-print-2: #b41e1e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Hind Siliguri', sans-serif;
    background: #e8eaef;
    color: var(--dark);
    line-height: 1.5;
    padding: 20px 0 80px;
}

/* Floating Toolbar */
.print-toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}
.print-toolbar button,
.print-toolbar a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 50px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.25s;
    border: none;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(10,22,85,0.15);
}
.btn-print {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
}
.btn-print:hover { transform: translateY(-2px); }
.btn-back {
    background: #fff;
    color: var(--navy);
    border: 1.5px solid #e5e7eb;
}
.btn-back:hover { border-color: var(--navy); background: #f5f7ff; }

/* Loading State */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,22,85,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    z-index: 999;
    gap: 16px;
}
.loading-overlay.hide { display: none; }
.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(242,210,123,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay p { font-size: 14px; font-weight: 600; }

/* Error State */
.error-box {
    max-width: 500px;
    margin: 100px auto;
    background: #fff;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(10,22,85,0.15);
}
.error-box i {
    font-size: 60px;
    color: var(--danger);
    opacity: 0.3;
    margin-bottom: 20px;
}
.error-box h2 {
    color: var(--navy);
    font-size: 20px;
    margin-bottom: 10px;
}
.error-box p {
    color: var(--grey);
    font-size: 14px;
    margin-bottom: 20px;
}

/* A4 PAGE */
.a4-page {
    width: 210mm;
    min-height: 297mm;
    background: #fff;
    margin: 0 auto;
    padding: 8mm;
    position: relative;
    box-shadow: 0 10px 40px rgba(10,22,85,0.15);
    overflow: hidden;
    page-break-after: always;
    break-after: page;
}

.a4-page:last-child {
    page-break-after: auto;
    break-after: auto;
}

@media screen {
    .a4-page {
        margin-bottom: 20px;
    }
}

@media print {
    .a4-page {
        margin: 0;
        box-shadow: none;
    }
}

/* Watermark */
.watermark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 70pt;
    color: rgba(240,242,247,0.9);
    transform: rotate(-30deg);
    pointer-events: none;
    user-select: none;
    letter-spacing: 8px;
    line-height: 1.2;
    text-align: center;
    z-index: 1;
}

/* Border */
.page-inner {
    position: relative;
    z-index: 2;
    padding: 3mm;
    min-height: 279mm;
    border: 2.5px solid var(--navy);
    border-radius: 2px;
    position: relative;
}
.page-inner::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid var(--gold-2);
    border-radius: 1px;
    pointer-events: none;
}

/* HEADER */
.print-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 6mm 5mm 5mm;
    margin: -3mm -3mm 0;
    position: relative;
    display: flex;
    align-items: center;
    gap: 5mm;
}
.print-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1.5mm;
    background: linear-gradient(90deg, var(--gold), var(--gold-2), var(--gold));
}
.print-header .logo-wrap {
    width: 20mm;
    height: 20mm;
    background: #fff;
    border-radius: 50%;
    padding: 1mm;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 2px solid var(--gold);
    overflow: hidden;
}
.print-header .logo-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}
.print-header .header-info {
    flex: 1;
    min-width: 0;
    text-align: center;
}
.print-header h1 {
    font-size: 22pt;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0;
    font-family: 'Playfair Display', serif;
    line-height: 1.1;
}
.print-header .name-bn {
    font-size: 13pt;
    font-weight: 600;
    margin-top: 1mm;
    color: var(--gold);
}
.print-header .meta {
    font-size: 8pt;
    margin-top: 1mm;
    color: #dbeafe;
    letter-spacing: 0.5px;
}
.print-header .title-badge {
    display: inline-block;
    background: rgba(242,210,123,0.2);
    color: var(--gold);
    padding: 1mm 4mm;
    border-radius: 4mm;
    font-size: 8.5pt;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-top: 1.5mm;
    border: 1px solid rgba(242,210,123,0.4);
}

/* APP ID + PHOTO ROW */
.info-row {
    display: flex;
    gap: 4mm;
    padding: 5mm 0 4mm;
    align-items: stretch;
}
.app-id-box {
    flex: 1;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border: 1px solid #93c5fd;
    border-left: 1.5mm solid var(--navy);
    border-radius: 2mm;
    padding: 3mm 4mm;
    display: flex;
    flex-direction: column;
    gap: 2mm;
}
.app-id-box .label {
    font-size: 7pt;
    font-weight: 700;
    color: #1e40af;
    letter-spacing: 1.5px;
}
.app-id-box .value {
    font-size: 16pt;
    font-weight: 700;
    color: var(--danger);
    font-family: 'Playfair Display', serif;
    letter-spacing: 1px;
    line-height: 1.1;
}
.app-id-box .date {
    font-size: 7.5pt;
    color: var(--grey);
}
.status-badge {
    display: inline-block;
    padding: 1.2mm 3mm;
    border-radius: 4mm;
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    align-self: flex-start;
}
.status-badge.pending { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
.status-badge.verified { background: #dbeafe; color: #1e40af; border: 1px solid #3b82f6; }
.status-badge.admitted { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
.status-badge.cancelled { background: #f3f4f6; color: #4b5563; border: 1px solid #9ca3af; }

.photo-box {
    width: 30mm;
    height: 36mm;
    border: 1.5px solid var(--navy);
    border-radius: 2mm;
    overflow: hidden;
    flex-shrink: 0;
    background: #f9fafb;
    display: flex;
    align-items: center;
    justify-content: center;
}
.photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.photo-box .no-photo {
    font-size: 7.5pt;
    color: var(--grey);
    text-align: center;
    padding: 4mm;
}

/* SECTIONS */
.section {
    margin-bottom: 3mm;
    page-break-inside: avoid;
}
.section-head {
    background: var(--navy);
    color: #fff;
    padding: 1.8mm 3mm;
    border-radius: 1mm;
    display: flex;
    align-items: center;
    gap: 2.5mm;
    position: relative;
    overflow: hidden;
}
.section-head::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0.6mm;
    background: var(--gold);
}
.section-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 6.5mm;
    height: 6.5mm;
    background: var(--gold);
    color: var(--navy);
    border-radius: 50%;
    font-size: 7pt;
    font-weight: 800;
    flex-shrink: 0;
}
.section-title {
    font-size: 9pt;
    font-weight: 700;
    letter-spacing: 1px;
}

.section-body {
    padding: 3mm 3mm 2mm;
    background: #fbfcff;
    border: 1px solid #e5e7eb;
    border-top: none;
    border-radius: 0 0 1mm 1mm;
}

.field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3mm 5mm;
    margin-bottom: 2.5mm;
}
.field-row.full { grid-template-columns: 1fr; }
.field-row.three { grid-template-columns: repeat(3, 1fr); }

.field {
    min-width: 0;
}
.field .label {
    font-size: 6.5pt;
    font-weight: 700;
    color: var(--grey);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 0.8mm;
}
.field .value {
    font-size: 10pt;
    font-weight: 600;
    color: var(--dark);
    word-break: break-word;
    line-height: 1.35;
}
.field .value.muted {
    color: var(--grey);
    font-weight: 500;
}

/* Subjects tags */
.subjects-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5mm;
    margin-top: 1mm;
}
.subj-tag {
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #86efac;
    padding: 1mm 2.5mm;
    border-radius: 4mm;
    font-size: 8pt;
    font-weight: 600;
}
.subj-tag.fourth {
    background: #fef3c7;
    color: #92400e;
    border-color: #fde68a;
}

/* INSTRUCTIONS BOX */
.instructions-box {
    background: #fffbeb;
    border: 1.5px solid #f59e0b;
    border-left: 2mm solid #f59e0b;
    border-radius: 2mm;
    padding: 3mm 4mm;
    margin-top: 3mm;
    page-break-inside: avoid;
}
.instructions-box h3 {
    font-size: 9pt;
    font-weight: 800;
    color: #92400e;
    margin-bottom: 1.5mm;
    letter-spacing: 0.5px;
}
.instructions-box ol {
    margin: 0;
    padding-left: 5mm;
    color: #78350f;
    font-size: 8.5pt;
    line-height: 1.7;
}
.instructions-box li {
    margin-bottom: 0.5mm;
}

/* ADMIN CHECKLIST */
.admin-checklist {
    background: #fef2f2;
    border: 1.5px solid var(--red-print-2);
    border-left: 2mm solid var(--red-print);
    border-radius: 2mm;
    padding: 3mm 4mm;
    margin-top: 3mm;
    page-break-inside: avoid;
}
.admin-checklist h3 {
    font-size: 9pt;
    font-weight: 800;
    color: var(--red-print);
    margin-bottom: 1.5mm;
    letter-spacing: 0.5px;
}
.admin-checklist .check-item {
    display: flex;
    align-items: flex-start;
    gap: 2mm;
    font-size: 8.5pt;
    color: var(--dark);
    margin-bottom: 1.2mm;
    line-height: 1.5;
}
.admin-checklist .checkbox {
    width: 3.5mm;
    height: 3.5mm;
    border: 1.2px solid var(--red-print);
    border-radius: 0.6mm;
    flex-shrink: 0;
    margin-top: 0.6mm;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 8pt;
    color: var(--red-print);
    font-weight: 800;
    line-height: 1;
}

/* ROLL FEE HIGHLIGHT */
.roll-fee-box {
    background: #d1fae5;
    border: 1.5px solid #10b981;
    border-radius: 2mm;
    padding: 3mm 4mm;
    margin-top: 3mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4mm;
    flex-wrap: wrap;
    page-break-inside: avoid;
}
.roll-fee-box .rb-label {
    font-size: 8pt;
    color: #065f46;
    font-weight: 700;
    letter-spacing: 1px;
}
.roll-fee-box .rb-value {
    font-size: 14pt;
    color: #065f46;
    font-weight: 800;
    font-family: 'Playfair Display', serif;
    line-height: 1.1;
}

/* SIGNATURE SECTION */
.signature-row {
    display: flex;
    justify-content: space-between;
    gap: 10mm;
    margin-top: 8mm;
    padding-top: 6mm;
    page-break-inside: avoid;
}
.sig-item {
    flex: 1;
    text-align: center;
}
.sig-line {
    border-top: 1px solid var(--dark);
    margin: 0 auto 1.5mm;
    width: 100%;
    max-width: 55mm;
}
.sig-label {
    font-size: 8pt;
    font-weight: 700;
    color: var(--dark);
}
.sig-date {
    font-size: 7pt;
    color: var(--grey);
    margin-top: 1mm;
}
.seal-box {
    width: 30mm;
    height: 20mm;
    border: 1.5px solid var(--red-print);
    border-radius: 1mm;
    margin: 3mm auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7pt;
    font-weight: 700;
    color: var(--red-print);
    letter-spacing: 0.5px;
}

/* FOOTER */
.print-footer {
    position: absolute;
    bottom: 3mm;
    left: 3mm;
    right: 3mm;
    background: var(--dark);
    color: #fff;
    padding: 2mm 3mm;
    border-radius: 1mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 7pt;
    gap: 3mm;
}
.print-footer .website {
    color: var(--gold);
    font-weight: 700;
}

/* ADMIN VERSION */
.admin-mode .page-inner {
    border-color: var(--red-print);
}
.admin-mode .page-inner::before {
    border-color: var(--red-print-2);
}
.admin-mode .print-header {
    background: linear-gradient(135deg, var(--red-print), var(--red-print-2));
}
.admin-mode .print-header::after {
    background: linear-gradient(90deg, #f5c850, #f2d27b, #f5c850);
}
.admin-mode .print-header .title-badge {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
}
.admin-mode .section-head {
    background: var(--red-print);
}
.admin-mode .section-head::after {
    background: #f5c850;
}
.admin-mode .section-num {
    background: #f5c850;
    color: var(--red-print);
}
.admin-mode .app-id-box {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    border-color: #fca5a5;
    border-left-color: var(--red-print);
}
.admin-mode .app-id-box .label {
    color: var(--red-print);
}
.admin-mode .print-footer {
    background: var(--red-print);
}
.admin-mode .watermark {
    color: rgba(252,240,240,0.9);
}

.admin-copy-ribbon {
    display: none;
    position: absolute;
    top: 5mm;
    left: 5mm;
    background: #fff;
    color: var(--red-print);
    padding: 1mm 3mm;
    border-radius: 1mm;
    font-size: 7.5pt;
    font-weight: 800;
    letter-spacing: 1px;
    z-index: 5;
    border: 1.5px solid var(--red-print);
}
.admin-mode .admin-copy-ribbon {
    display: inline-block;
}

/* PRINT STYLES */
@media print {
    @page {
        size: A4;
        margin: 0;
    }
    body {
        background: #fff;
        padding: 0;
    }
    .print-toolbar,
    .loading-overlay {
        display: none !important;
    }
    .a4-page {
        box-shadow: none;
        margin: 0;
        width: 210mm;
        min-height: 297mm;
        padding: 8mm;
    }
    .watermark {
        opacity: 1;
    }
}

/* MOBILE */
@media screen and (max-width: 800px) {
    body { padding: 10px 0 80px; }
    .a4-page {
        width: 100%;
        max-width: 100%;
        padding: 4mm;
        min-height: auto;
    }
    .page-inner {
        min-height: auto;
        padding: 2mm;
    }
    .print-header {
        flex-direction: column;
        padding: 4mm 3mm;
        text-align: center;
    }
    .print-header .logo-wrap {
        width: 16mm;
        height: 16mm;
    }
    .print-header h1 { font-size: 16pt; }
    .print-header .name-bn { font-size: 11pt; }
    .field-row,
    .field-row.three {
        grid-template-columns: 1fr;
        gap: 2mm;
    }
    .info-row {
        flex-direction: column;
        padding: 3mm 0;
    }
    .photo-box {
        align-self: center;
        width: 26mm;
        height: 32mm;
    }
    .app-id-box .value { font-size: 13pt; }
    .section-title { font-size: 8pt; }
    .watermark {
        font-size: 40pt;
        letter-spacing: 4px;
    }
    .signature-row {
        flex-direction: column;
        gap: 6mm;
    }
    .print-footer {
        position: static;
        margin-top: 5mm;
        font-size: 6.5pt;
        flex-direction: column;
        gap: 1mm;
    }
    .print-toolbar {
        top: 8px;
        right: 8px;
        left: 8px;
        justify-content: space-between;
    }
    .print-toolbar button,
    .print-toolbar a {
        padding: 8px 14px;
        font-size: 12.5px;
    }
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p>Application লোড হচ্ছে...</p>
</div>

<!-- TOOLBAR -->
<div class="print-toolbar" id="toolbar" style="display:none;">
    <a href="javascript:history.back()" class="btn-back">
        <i class="fas fa-arrow-left"></i> Back
    </a>
    <button class="btn-print" id="printBtn">
        <i class="fas fa-print"></i> Print / Save as PDF
    </button>
</div>

<!-- ERROR -->
<div id="errorBox" style="display:none;" class="error-box">
    <i class="fas fa-exclamation-triangle"></i>
    <h2>Application পাওয়া যায়নি</h2>
    <p id="errorMsg">Application ID সঠিক নয় বা ডেটা লোড করা যায়নি।</p>
    <a href="javascript:history.back()" class="btn-back">← ফিরে যান</a>
</div>

<!-- PRINT VIEW -->
<div id="printRoot" style="display:none;"></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admission-print.js?v=1.0"></script>

</body>
</html>
