<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result - Fulbariya College</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --dark: #1f2937;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --border: #e5e7eb;
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
}

* { font-family: 'Hind Siliguri', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--off-white); margin: 0; color: var(--dark); }

/* ============ HEADER ============ */
.public-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(10,22,85,0.2);
    flex-wrap: wrap;
    gap: 10px;
}
.public-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.public-header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
}
.public-header .brand-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    border: 1px solid rgba(242,210,123,0.3);
}
.public-header h4 { margin: 0; font-size: 14px; font-weight: 700; }
.public-header small { font-size: 10px; opacity: 0.85; display: block; margin-top: 1px; }

.btn-header {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}
.btn-header:hover { background: rgba(255,255,255,0.25); color: #fff; }

/* ============ MAIN ============ */
.main-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

/* ============ LOADING / EMPTY ============ */
.loading-area {
    display: none;
    text-align: center;
    padding: 60px 20px;
}
.loading-area.show { display: block; }
.spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(10,22,85,0.1);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-area p { color: var(--grey); font-size: 14px; margin: 0; }

.empty-state {
    text-align: center;
    padding: 60px 20px;
    background: #fff;
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
}
.empty-state .icon-wrap {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, rgba(10,22,85,0.06), rgba(13,71,161,0.04));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
}
.empty-state i { font-size: 36px; color: var(--navy); opacity: 0.35; }
.empty-state h6 { color: #374151; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.empty-state p { font-size: 13px; color: var(--grey); margin: 0 0 20px; }

/* ================================================================ */
/*              RESULT SHEET — OFFICIAL TRANSCRIPT                  */
/* ================================================================ */

.result-area { display: none; }
.result-area.show { display: block; }

.sheet-wrapper {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(10,22,85,0.1);
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    position: relative;
}

/* Watermark */
.sheet-wrapper::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url('../assets/images/logo1.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 400px;
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
}

/* ============ SHEET HEADER ============ */
.sheet-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 24px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    position: relative;
    z-index: 1;
}
.sheet-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-2), var(--gold), transparent);
}
.sheet-header .sh-logo {
    width: 70px; height: 70px;
    border-radius: 12px;
    background: #fff;
    padding: 6px;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
}
.sheet-header .sh-logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}
.sheet-header .sh-info { flex: 1; min-width: 0; }
.sheet-header .sh-college {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.2;
    color: #fff;
}
.sheet-header .sh-address {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 4px;
    letter-spacing: 0.3px;
}
.sheet-header .sh-title {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(242,210,123,0.3);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
}
.sheet-header .sh-exam {
    font-size: 11.5px;
    opacity: 0.9;
    margin-top: 3px;
    letter-spacing: 0.3px;
}

/* ============ STUDENT INFO ============ */
.student-info {
    padding: 20px 28px;
    background: #fafbff;
    border-bottom: 2px solid var(--border);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px 20px;
    position: relative;
    z-index: 1;
}
.si-item { min-width: 0; }
.si-item .si-label {
    font-size: 10px;
    color: var(--grey);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
}
.si-item .si-value {
    font-size: 13.5px;
    color: var(--navy);
    font-weight: 700;
    word-break: break-word;
}

/* ============ SECTIONS ============ */
.section {
    padding: 18px 28px;
    position: relative;
    z-index: 1;
}
.section + .section { padding-top: 0; }
.section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    padding: 8px 14px;
    background: linear-gradient(90deg, rgba(10,22,85,0.06), rgba(10,22,85,0.01));
    border-left: 4px solid var(--gold-2);
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.section-title i { color: var(--gold-dark); }

/* ============ MARKS TABLE ============ */
.marks-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    margin-bottom: 8px;
}
.marks-table thead th {
    background: var(--navy);
    color: #fff;
    padding: 10px 8px;
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    border-right: 1px solid rgba(255,255,255,0.1);
}
.marks-table thead th:first-child {
    text-align: left;
    padding-left: 14px;
    width: 45%;
}
.marks-table thead th:last-child { border-right: none; }

.marks-table tbody tr {
    border-bottom: 1px solid var(--border);
}
.marks-table tbody tr.paper-row {
    background: #fff;
}
.marks-table tbody tr.paper-row:hover {
    background: #fafbff;
}
.marks-table tbody tr.combined-row {
    background: #f0f4f8;
    border-top: 2px solid var(--navy);
}
.marks-table tbody tr.combined-row td {
    font-weight: 700;
    color: var(--navy);
}

.marks-table tbody td {
    padding: 8px 8px;
    text-align: center;
    vertical-align: middle;
    border-right: 1px solid #f3f4f6;
}
.marks-table tbody td:first-child {
    text-align: left;
    padding-left: 14px;
    font-weight: 600;
    color: var(--dark);
}
.marks-table tbody td:last-child { border-right: none; }

/* Book Header Row */
.marks-table tbody tr.book-header {
    background: linear-gradient(90deg, rgba(10,22,85,0.04), transparent);
    border-bottom: 1px solid var(--navy);
}
.marks-table tbody tr.book-header td {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    text-align: left;
    border-right: none;
}

.book-header-content {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
.book-header-content i { color: var(--gold-dark); }
.book-header-content .bh-code {
    background: rgba(10,22,85,0.08);
    color: var(--navy);
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
}

/* Paper Row */
.paper-label {
    padding-left: 28px !important;
    color: var(--grey);
    font-weight: 500;
    font-size: 12px;
    position: relative;
}
.paper-label::before {
    content: '↳';
    position: absolute;
    left: 14px;
    color: var(--gold-dark);
    font-weight: 700;
}

/* Marks Cells */
.marks-cell {
    font-weight: 600;
    color: var(--dark);
    font-size: 12.5px;
}
.marks-cell.empty { color: #cbd5e1; }

.total-cell {
    font-weight: 700;
    color: var(--navy);
    font-family: 'Playfair Display', serif;
    font-size: 13.5px;
}

/* Grade Badge */
.grade-badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    min-width: 32px;
    letter-spacing: 0.3px;
}
.grade-badge.Aplus { background: #dcfce7; color: #166534; }
.grade-badge.A { background: #d1fae5; color: #065f46; }
.grade-badge.Aminus { background: #dbeafe; color: #1e40af; }
.grade-badge.B { background: #fef3c7; color: #92400e; }
.grade-badge.C { background: #fed7aa; color: #9a3412; }
.grade-badge.D { background: #fecaca; color: #991b1b; }
.grade-badge.F { background: #7f1d1d; color: #fff; }

/* GP Cell */
.gp-cell {
    font-weight: 700;
    font-family: 'Playfair Display', serif;
    font-size: 12.5px;
    color: var(--navy);
}
.gp-cell.high { color: #059669; }
.gp-cell.mid { color: #d97706; }
.gp-cell.low { color: #dc2626; }

/* ============ RESULT SUMMARY ============ */
.result-summary {
    padding: 20px 28px;
    background: #fafbff;
    border-top: 3px double var(--navy);
    border-bottom: 3px double var(--navy);
    position: relative;
    z-index: 1;
}
.summary-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.summary-title i { color: var(--gold-dark); }

.summary-breakdown {
    background: #fff;
    border-radius: 10px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
}
.sb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 12.5px;
    border-bottom: 1px dashed #f0f2f5;
}
.sb-row:last-child { border-bottom: none; }
.sb-row.highlight {
    border-top: 1px solid var(--navy);
    border-bottom: none;
    padding-top: 10px;
    margin-top: 6px;
    font-weight: 700;
    color: var(--navy);
    font-size: 13.5px;
}
.sb-label { color: var(--dark); }
.sb-value {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    color: var(--navy);
    font-size: 13px;
}
.sb-value.high { color: #059669; }

/* Final Result Box */
.final-box {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
}
.fb-item {
    text-align: center;
    padding: 16px 12px;
    border-radius: 12px;
    background: #fff;
    border: 2px solid var(--border);
}
.fb-item.gpa {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    border-color: var(--navy);
}
.fb-item.grade {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    border-color: var(--gold-2);
}
.fb-item.status {
    background: linear-gradient(135deg, #10b981, #059669);
    border-color: #059669;
}
.fb-item.status.fail {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-color: #dc2626;
}
.fb-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.85;
    margin-bottom: 4px;
}
.fb-value {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
}
.fb-item.gpa .fb-label { color: var(--gold); }
.fb-item.gpa .fb-value { color: #fff; }
.fb-item.grade .fb-label { color: rgba(10,22,85,0.7); }
.fb-item.grade .fb-value { color: var(--navy); }
.fb-item.status .fb-label { color: rgba(255,255,255,0.85); }
.fb-item.status .fb-value { color: #fff; font-size: 22px; }

/* ============ FOOTER ============ */
.sheet-footer {
    padding: 20px 28px;
    background: #fafbff;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
}
.footer-note {
    font-size: 11px;
    color: var(--grey);
    line-height: 1.6;
    max-width: 400px;
}
.footer-note strong { color: var(--navy); }
.signature {
    text-align: center;
    min-width: 180px;
}
.signature .sig-line {
    border-top: 1.5px solid var(--navy);
    padding-top: 6px;
    margin-top: 30px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.3px;
}
.signature .sig-sub {
    font-size: 10px;
    color: var(--grey);
    margin-top: 2px;
}

/* ============ ACTION BUTTONS ============ */
.action-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 20px;
    background: #fff;
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    margin-top: 20px;
}

.btn-action {
    padding: 11px 22px;
    border-radius: 50px;
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
}
.btn-action.primary {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    box-shadow: 0 4px 16px rgba(10,22,85,0.25);
}
.btn-action.primary:hover { transform: translateY(-2px); color: #fff; }
.btn-action.gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    box-shadow: 0 4px 16px rgba(212,175,55,0.3);
}
.btn-action.gold:hover { transform: translateY(-2px); color: var(--navy); }
.btn-action.secondary {
    background: #fff;
    color: var(--navy);
    border: 1.5px solid var(--border);
}
.btn-action.secondary:hover { border-color: var(--navy); background: #f5f7ff; }
.btn-action i { font-size: 14px; }

/* ============ ERROR ALERT ============ */
.error-alert {
    background: #fef2f2;
    border-left: 4px solid var(--danger);
    color: #991b1b;
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 13.5px;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
}
.error-alert i { font-size: 18px; margin-top: 1px; }

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
    .main-wrap { padding: 14px 10px 50px; }
    .sheet-header { padding: 18px 16px; flex-direction: column; text-align: center; }
    .sheet-header .sh-college { font-size: 18px; }
    .sheet-header .sh-title { font-size: 12px; }
    .student-info { padding: 16px; grid-template-columns: 1fr 1fr; }
    .section { padding: 14px 16px; }
    .section-title { font-size: 11.5px; padding: 6px 10px; }
    .marks-table { font-size: 11px; }
    .marks-table thead th { padding: 8px 4px; font-size: 9.5px; }
    .marks-table tbody td { padding: 6px 4px; }
    .marks-table thead th:first-child,
    .marks-table tbody td:first-child { padding-left: 8px; }
    .paper-label { padding-left: 16px !important; }
    .paper-label::before { left: 6px; }
    .result-summary { padding: 16px; }
    .final-box { grid-template-columns: 1fr; gap: 8px; }
    .fb-value { font-size: 22px; }
    .sheet-footer { padding: 16px; flex-direction: column; align-items: stretch; }
    .signature { min-width: auto; }
    .action-buttons { padding: 14px; }
    .btn-action { padding: 10px 16px; font-size: 12px; flex: 1; justify-content: center; }
}

@media (max-width: 480px) {
    .btn-header span { display: none; }
    .student-info { grid-template-columns: 1fr; }
    .marks-table thead th:first-child { width: auto; }
}

/* ======================================================================== */
/*                    PRINT STYLES — OFFICIAL TRANSCRIPT                    */
/* ======================================================================== */
@media print {
    /* Page setup */
    @page {
        size: A4 portrait;
        margin: 10mm 8mm;
    }

    /* Reset */
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    html, body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        font-size: 11pt !important;
    }

    /* Hide non-printable elements */
    .public-header,
    .action-buttons,
    .error-alert,
    .loading-area,
    .empty-state { display: none !important; }

    /* Main container reset */
    .main-wrap {
        padding: 0 !important;
        max-width: none !important;
        margin: 0 !important;
    }

    .result-area { display: block !important; }

    /* Sheet wrapper */
    .sheet-wrapper {
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        border: none !important;
        page-break-inside: auto;
        position: relative;
    }
    .sheet-wrapper::before {
        opacity: 0.05 !important;
        background-size: 300px !important;
    }

    /* Header — keep on first page */
    .sheet-header {
        page-break-inside: avoid;
        page-break-after: avoid;
        padding: 14px 18px !important;
    }
    .sheet-header .sh-logo {
        width: 55px !important;
        height: 55px !important;
    }
    .sheet-header .sh-college { font-size: 18pt !important; }
    .sheet-header .sh-address { font-size: 9pt !important; }
    .sheet-header .sh-title { font-size: 11pt !important; padding-top: 6px !important; margin-top: 6px !important; }
    .sheet-header .sh-exam { font-size: 9pt !important; }

    /* Student info */
    .student-info {
        page-break-inside: avoid;
        page-break-after: avoid;
        padding: 12px 18px !important;
        gap: 8px 14px !important;
    }
    .si-item .si-label { font-size: 8pt !important; }
    .si-item .si-value { font-size: 10pt !important; }

    /* Sections */
    .section {
        padding: 10px 18px !important;
        page-break-inside: auto;
    }
    .section + .section {
        padding-top: 0 !important;
        page-break-before: auto;
    }
    .section-title {
        page-break-after: avoid;
        font-size: 10pt !important;
        padding: 5px 10px !important;
        margin-bottom: 8px !important;
    }

    /* Tables */
    .marks-table {
        page-break-inside: auto;
        font-size: 9.5pt !important;
        width: 100% !important;
    }
    .marks-table thead {
        display: table-header-group;
    }
    .marks-table thead th {
        font-size: 8.5pt !important;
        padding: 6px 4px !important;
        background: #0a1655 !important;
        color: #fff !important;
    }
    .marks-table tbody tr {
        page-break-inside: avoid;
        page-break-after: auto;
    }
    .marks-table tbody tr.book-header {
