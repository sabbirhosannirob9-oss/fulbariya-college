<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Hub - Fulbariya College</title>
<meta name="description" content="একাডেমিক ক্যালেন্ডার ও ক্লাস রুটিন - Fulbariya College">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --dark: #1f2937;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --purple: #8b5cf6;
    --border: rgba(0,0,0,0.06);
    --border-light: rgba(0,0,0,0.04);
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
    --shadow-md: 0 4px 16px rgba(10,22,85,0.08);
    --shadow-lg: 0 12px 40px rgba(10,22,85,0.12);
}

* { font-family: 'Hind Siliguri', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--off-white); margin: 0; color: var(--dark); }

/* HEADER */
.public-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(10,22,85,0.2);
    flex-wrap: wrap;
    gap: 12px;
}
.public-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.public-header .brand { display: flex; align-items: center; gap: 12px; }
.public-header .brand-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 1px solid rgba(242,210,123,0.3);
    flex-shrink: 0;
}
.public-header h4 { margin: 0; font-size: 17px; font-weight: 700; }
.public-header small { font-size: 11px; opacity: 0.85; display: block; margin-top: 2px; }
.btn-header {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}
.btn-header:hover { background: rgba(255,255,255,0.25); color: #fff; transform: translateY(-1px); }

/* HERO */
.hero {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 40px 20px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(242,210,123,0.15), transparent 70%);
    border-radius: 50%;
}
.hero::after {
    content: '';
    position: absolute;
    bottom: -50%; left: -20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(242,210,123,0.08), transparent 70%);
    border-radius: 50%;
}
.hero-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
.hero .hero-icon {
    width: 80px; height: 80px;
    border-radius: 20px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    border: 2px solid rgba(242,210,123,0.3);
    margin-bottom: 18px;
    box-shadow: 0 8px 32px rgba(242,210,123,0.25);
}
.hero h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 10px;
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.3px;
    color: #fff;
}
.hero h1 span { color: var(--gold); }
.hero p { font-size: 14px; opacity: 0.85; margin: 0; line-height: 1.7; }

/* MAIN */
.main-wrap {
    max-width: 1000px;
    margin: -50px auto 40px;
    padding: 0 16px;
    position: relative;
    z-index: 2;
}

/* TABS */
.tabs-container {
    background: #fff;
    border-radius: 20px;
    padding: 8px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 24px;
}
.tab-btn {
    padding: 16px 20px;
    border-radius: 14px;
    border: none;
    background: transparent;
    color: var(--grey);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: inherit;
    position: relative;
}
.tab-btn:hover { color: var(--navy); background: #f5f7ff; }
.tab-btn.active {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    box-shadow: 0 6px 20px rgba(10,22,85,0.25);
}
.tab-btn.active i { color: var(--gold); }
.tab-btn i { font-size: 18px; }

.tab-btn .tab-count {
    background: rgba(10,22,85,0.08);
    color: var(--navy);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
}
.tab-btn.active .tab-count {
    background: rgba(242,210,123,0.25);
    color: var(--gold);
}

/* TAB CONTENT */
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* FILTER BAR */
.filter-bar {
    background: #fff;
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-items: end;
}
.filter-bar label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
    margin-bottom: 5px;
}
.filter-bar select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    background: #fafbff;
    font-size: 13.5px;
    outline: none;
    transition: 0.25s;
    font-family: inherit;
    font-weight: 600;
    color: var(--navy);
}
.filter-bar select:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.06);
    background: #fff;
}

/* STATS */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.stat-pill {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: 0.3s;
}
.stat-pill:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.stat-pill .sp-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}
.stat-pill .sp-icon.exam { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
.stat-pill .sp-icon.holiday { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
.stat-pill .sp-icon.event { background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: #fff; }
.stat-pill .sp-icon.total { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--gold); }
.stat-pill .sp-info { min-width: 0; }
.stat-pill .sp-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.stat-pill .sp-label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
}

/* EVENTS LIST */
.events-list {
    display: grid;
    gap: 14px;
}
.event-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    display: flex;
    gap: 20px;
    align-items: flex-start;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}
.event-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--navy);
}
.event-card.exam::before { background: linear-gradient(180deg, #dc2626, #ef4444); }
.event-card.holiday::before { background: linear-gradient(180deg, #059669, #10b981); }
.event-card.event::before { background: linear-gradient(180deg, #8b5cf6, #a78bfa); }
.event-card.result::before { background: linear-gradient(180deg, #f59e0b, #fbbf24); }
.event-card.admission::before { background: linear-gradient(180deg, #2563eb, #3b82f6); }
.event-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
}
.event-card.past { opacity: 0.65; }

.event-date-box {
    flex-shrink: 0;
    width: 80px;
    text-align: center;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-radius: 14px;
    padding: 12px 8px;
}
.event-card.exam .event-date-box { background: linear-gradient(135deg, #dc2626, #ef4444); }
.event-card.holiday .event-date-box { background: linear-gradient(135deg, #059669, #10b981); }
.event-card.event .event-date-box { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
.event-card.result .event-date-box { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
.event-card.admission .event-date-box { background: linear-gradient(135deg, #2563eb, #3b82f6); }

.event-date-box .day {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.event-date-box .month {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
    color: rgba(255,255,255,0.95);
    font-weight: 600;
}
.event-date-box .year {
    font-size: 10px;
    opacity: 0.8;
    margin-top: 2px;
}

.event-body { flex: 1; min-width: 0; }
.event-body h4 {
    font-size: 17px;
    color: var(--navy);
    margin: 0 0 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    line-height: 1.35;
}
.event-body p {
    font-size: 13.5px;
    color: var(--grey);
    margin: 0 0 10px;
    line-height: 1.65;
}
.event-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--grey);
    padding-top: 10px;
    border-top: 1px dashed var(--border);
}
.event-meta span { display: inline-flex; align-items: center; gap: 6px; }
.event-meta i { color: var(--gold-dark); }

.event-type-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
}
.event-type-badge.exam { background: #fef2f2; color: #991b1b; }
.event-type-badge.holiday { background: #dcfce7; color: #166534; }
.event-type-badge.event { background: #f3e8ff; color: #6b21a8; }
.event-type-badge.result { background: #fef3c7; color: #92400e; }
.event-type-badge.admission { background: #dbeafe; color: #1e40af; }
.event-type-badge.general { background: #f3f4f6; color: #374151; }

.event-status-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.event-status-badge.upcoming {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    box-shadow: 0 4px 12px rgba(212,175,55,0.35);
}
.event-status-badge.today {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 4px 12px rgba(16,185,129,0.4);
    animation: pulse-badge 2s infinite;
}
@keyframes pulse-badge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
}
.event-status-badge.past {
    background: #e5e7eb;
    color: #6b7280;
}

/* ROUTINE GRID */
.routine-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
}

.routine-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: 0.35s;
    position: relative;
}
.routine-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-lg);
}
.routine-card .rc-img-wrap {
    width: 100%;
    height: 240px;
    background: linear-gradient(135deg, #f0f4ff, #e0e7ff);
    overflow: hidden;
    cursor: pointer;
    position: relative;
}
.routine-card .rc-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
}
.routine-card:hover .rc-img-wrap img { transform: scale(1.05); }

.routine-card .rc-branch {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: var(--gold);
    z-index: 2;
}

.routine-card .rc-overlay-btn {
    position: absolute;
    inset: 0;
    background: rgba(10,22,85,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    opacity: 0;
    transition: 0.3s;
    z-index: 3;
}
.routine-card .rc-img-wrap:hover .rc-overlay-btn { opacity: 1; }

.routine-card .rc-body {
    padding: 14px 16px 16px;
}
.routine-card .rc-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.routine-card .rc-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
}
.routine-card .rc-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 700;
    background: #f3f4f6;
    color: var(--dark);
}
.routine-card .rc-tag.class { background: #dbeafe; color: #1e40af; }
.routine-card .rc-tag.group { background: #fef3c7; color: #92400e; }
.routine-card .rc-tag.session { background: #dcfce7; color: #166534; }

.routine-card .rc-actions {
    display: flex;
    gap: 6px;
    border-top: 1px solid var(--border-light);
    padding-top: 12px;
}
.routine-card .rc-btn {
    flex: 1;
    padding: 9px 10px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-family: inherit;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    text-decoration: none;
}
.routine-card .rc-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(10,22,85,0.3); color: #fff; }
.routine-card .rc-btn i { color: var(--gold); }
.routine-card .rc-btn.outline {
    background: #fff;
    color: var(--navy);
    border: 1.5px solid #e5e7eb;
}
.routine-card .rc-btn.outline:hover { border-color: var(--navy); background: #f5f7ff; }
.routine-card .rc-btn.outline i { color: var(--navy); }

/* EMPTY STATE */
.empty-state {
    text-align: center;
    padding: 70px 20px;
    background: #fff;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    grid-column: 1 / -1;
}
.empty-state .icon-wrap {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, rgba(10,22,85,0.06), rgba(13,71,161,0.04));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
}
.empty-state i { font-size: 36px; color: var(--navy); opacity: 0.35; }
.empty-state h6 { color: #374151; font-weight: 700; font-size: 17px; margin-bottom: 8px; }
.empty-state p { font-size: 13.5px; color: var(--grey); margin: 0; }

/* LOADING */
.loading-card {
    background: #fff;
    border-radius: 20px;
    padding: 60px 20px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    grid-column: 1 / -1;
}
.loading-spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(10,22,85,0.1);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-card p { color: var(--grey); font-size: 13.5px; margin: 0; }

/* MODAL: Image Preview */
.preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 40, 0.9);
    backdrop-filter: blur(8px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.25s ease;
}
.preview-overlay.show { display: flex; }
.preview-box {
    max-width: 95vw;
    max-height: 90vh;
    position: relative;
    animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes zoomIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
.preview-box img {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: block;
}
.preview-close {
    position: absolute;
    top: -50px;
    right: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
}
.preview-close:hover { background: var(--danger); transform: rotate(90deg); }
.preview-actions {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
}
.preview-actions .btn-prev {
    padding: 10px 22px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    border: none;
    border-radius: 50px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: 0.25s;
    font-family: inherit;
}
.preview-actions .btn-prev:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(242,210,123,0.4); color: var(--navy); }

/* FOOTER */
.footer {
    text-align: center;
    padding: 30px 20px 40px;
    color: var(--grey);
    font-size: 12px;
}
.footer i { color: var(--gold-2); }
.footer .footer-line {
    max-width: 400px;
    margin: 0 auto 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(10,22,85,0.15), transparent);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .public-header { padding: 10px 14px; }
    .public-header h4 { font-size: 14px; }
    .hero { padding: 30px 16px 70px; }
    .hero h1 { font-size: 22px; }
    .hero p { font-size: 12.5px; }
    .hero .hero-icon { width: 64px; height: 64px; font-size: 26px; }
    .main-wrap { padding: 0 12px; margin-top: -45px; }

    .tabs-container { padding: 6px; gap: 6px; }
    .tab-btn { padding: 13px 12px; font-size: 13.5px; gap: 6px; }
    .tab-btn i { font-size: 15px; }

    .filter-bar { padding: 14px; border-radius: 14px; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-pill { padding: 11px 13px; }
    .stat-pill .sp-icon { width: 34px; height: 34px; font-size: 14px; }
    .stat-pill .sp-value { font-size: 18px; }

    .event-card { padding: 16px 18px; gap: 14px; flex-wrap: wrap; }
    .event-date-box { width: 66px; padding: 9px 6px; }
    .event-date-box .day { font-size: 22px; }
    .event-date-box .month { font-size: 9.5px; }
    .event-body h4 { font-size: 15px; }
    .event-body p { font-size: 12.5px; }
    .event-meta { font-size: 11px; gap: 12px; }
    .event-status-badge { top: 10px; right: 10px; font-size: 9.5px; padding: 3px 9px; }

    .routine-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .routine-card .rc-img-wrap { height: 180px; }

    .preview-close { top: -44px; width: 38px; height: 38px; }
    .preview-actions { bottom: -55px; }
}

@media (max-width: 480px) {
    .filter-bar { grid-template-columns: 1fr; }
    .hero h1 { font-size: 19px; }
    .event-status-badge { position: static; display: inline-block; margin-bottom: 8px; }
    .routine-grid { grid-template-columns: 1fr 1fr; }
    .routine-card .rc-img-wrap { height: 140px; }
    .routine-card .rc-body { padding: 10px 12px 12px; }
    .routine-card .rc-title { font-size: 13px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="public-header">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
        <div>
            <h4>Academic Hub</h4>
            <small>Fulbariya College</small>
        </div>
    </div>
    <a href="../index.html" class="btn-header">
        <i class="fas fa-home"></i> <span>Home</span>
    </a>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <div class="hero-icon"><i class="fas fa-book-reader"></i></div>
        <h1>একাডেমিক <span>হাব</span></h1>
        <p>ক্যালেন্ডার ও ক্লাস রুটিন — এক জায়গায়</p>
    </div>
</section>

<!-- MAIN -->
<div class="main-wrap">

    <!-- TABS -->
    <div class="tabs-container">
        <button class="tab-btn active" data-tab="calendar">
            <i class="fas fa-calendar-alt"></i>
            <span>ক্যালেন্ডার</span>
            <span class="tab-count" id="calendarCount">0</span>
        </button>
        <button class="tab-btn" data-tab="routine">
            <i class="fas fa-calendar-week"></i>
            <span>রুটিন</span>
            <span class="tab-count" id="routineCount">0</span>
        </button>
    </div>

    <!-- TAB: CALENDAR -->
    <div class="tab-content active" id="tab-calendar">
        <!-- Filter -->
        <div class="filter-bar">
            <div>
                <label>Year</label>
                <select id="calFilterYear">
                    <option value="">All Years</option>
                </select>
            </div>
            <div>
                <label>Event Type</label>
                <select id="calFilterType">
                    <option value="">All Types</option>
                    <option value="exam">📝 পরীক্ষা</option>
                    <option value="holiday">🏖️ ছুটি</option>
                    <option value="event">🎉 ইভেন্ট</option>
                    <option value="result">🏆 ফলাফল</option>
                    <option value="admission">📋 ভর্তি</option>
                    <option value="general">📌 সাধারণ</option>
                </select>
            </div>
            <div>
                <label>Time</label>
                <select id="calFilterTime">
                    <option value="all">সব</option>
                    <option value="upcoming">আসন্ন</option>
                    <option value="past">অতীত</option>
                </select>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-pill">
                <div class="sp-icon total"><i class="fas fa-calendar-alt"></i></div>
                <div class="sp-info">
                    <div class="sp-value" id="calStatTotal">0</div>
                    <div class="sp-label">Total</div>
                </div>
            </div>
            <div class="stat-pill">
                <div class="sp-icon exam"><i class="fas fa-file-alt"></i></div>
                <div class="sp-info">
                    <div class="sp-value" id="calStatExam">0</div>
                    <div class="sp-label">Exams</div>
                </div>
            </div>
            <div class="stat-pill">
                <div class="sp-icon holiday"><i class="fas fa-umbrella-beach"></i></div>
                <div class="sp-info">
                    <div class="sp-value" id="calStatHoliday">0</div>
                    <div class="sp-label">Holidays</div>
                </div>
            </div>
            <div class="stat-pill">
                <div class="sp-icon event"><i class="fas fa-glass-cheers"></i></div>
                <div class="sp-info">
                    <div class="sp-value" id="calStatEvent">0</div>
                    <div class="sp-label">Events</div>
                </div>
            </div>
        </div>

        <!-- Events List -->
        <div class="events-list" id="eventsList">
            <div class="loading-card">
                <div class="loading-spinner"></div>
                <p>লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- TAB: ROUTINE -->
    <div class="tab-content" id="tab-routine">
        <!-- Filter -->
        <div class="filter-bar">
            <div>
                <label>Branch</label>
                <select id="rtFilterBranch">
                    <option value="">All Branches</option>
                    <option value="HSC">HSC</option>
                    <option value="BM">BM</option>
                </select>
            </div>
            <div>
                <label>Class</label>
                <select id="rtFilterClass">
                    <option value="">All Classes</option>
                    <option value="11">Class 11</option>
                    <option value="12">Class 12</option>
                </select>
            </div>
            <div>
                <label>Group</label>
                <select id="rtFilterGroup">
                    <option value="">All Groups</option>
                    <option value="Science">Science</option>
                    <option value="Humanities">Humanities</option>
                    <option value="Business">Business</option>
                    <option value="BM-General">BM-General</option>
                </select>
            </div>
        </div>

        <!-- Routine Grid -->
        <div class="routine-grid" id="routineGrid">
            <div class="loading-card">
                <div class="loading-spinner"></div>
                <p>লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

</div>

<!-- PREVIEW MODAL -->
<div class="preview-overlay" id="previewOverlay">
    <div class="preview-box">
        <button class="preview-close" id="previewClose">
            <i class="fas fa-times"></i>
        </button>
        <img id="previewImg" src="" alt="Preview">
        <div class="preview-actions">
            <a href="#" id="previewDownload" class="btn-prev" download>
                <i class="fas fa-download"></i> Download
            </a>
        </div>
    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-line"></div>
    <p><i class="fas fa-graduation-cap"></i> Fulbariya College · Academic Hub</p>
    <p style="font-size: 11px; margin-top: 6px;">&copy; 2026 All rights reserved</p>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/academic-hub.js"></script>

</body>
</html>
