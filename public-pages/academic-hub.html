<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Calendar - Fulbariya College</title>
<meta name="description" content="একাডেমিক ক্যালেন্ডার - Fulbariya College">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --dark: #1f2937;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --purple: #8b5cf6;
    --border: rgba(0,0,0,0.06);
    --border-light: rgba(0,0,0,0.04);
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
    --shadow-md: 0 4px 16px rgba(10,22,85,0.08);
    --shadow-lg: 0 12px 40px rgba(10,22,85,0.12);
}

* { font-family: 'Hind Siliguri', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--off-white); margin: 0; color: var(--dark); }

/* HEADER */
.public-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(10,22,85,0.2);
    flex-wrap: wrap;
    gap: 12px;
}
.public-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.public-header .brand { display: flex; align-items: center; gap: 12px; }
.public-header .brand-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 1px solid rgba(242,210,123,0.3);
    flex-shrink: 0;
}
.public-header h4 { margin: 0; font-size: 17px; font-weight: 700; }
.public-header small { font-size: 11px; opacity: 0.85; display: block; margin-top: 2px; }
.btn-header {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}
.btn-header:hover { background: rgba(255,255,255,0.25); color: #fff; transform: translateY(-1px); }

/* HERO */
.hero {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 40px 20px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(242,210,123,0.15), transparent 70%);
    border-radius: 50%;
}
.hero::after {
    content: '';
    position: absolute;
    bottom: -50%; left: -20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(242,210,123,0.08), transparent 70%);
    border-radius: 50%;
}
.hero-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
.hero .hero-icon {
    width: 80px; height: 80px;
    border-radius: 20px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    border: 2px solid rgba(242,210,123,0.3);
    margin-bottom: 18px;
    box-shadow: 0 8px 32px rgba(242,210,123,0.25);
}
.hero h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 10px;
    font-family: 'Playfair Display', serif;
    letter-spacing: 0.3px;
    color: #fff;
}
.hero h1 span { color: var(--gold); }
.hero p { font-size: 14px; opacity: 0.85; margin: 0; line-height: 1.7; }

/* MAIN */
.main-wrap {
    max-width: 1000px;
    margin: -50px auto 40px;
    padding: 0 16px;
    position: relative;
    z-index: 2;
}

/* COUNT BADGE (top info bar) */
.info-bar {
    background: #fff;
    border-radius: 20px;
    padding: 16px 22px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}
.info-bar .ib-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.info-bar .ib-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}
.info-bar .ib-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin: 0;
}
.info-bar .ib-sub {
    font-size: 11.5px;
    color: var(--grey);
    margin: 2px 0 0;
}
.info-bar .ib-count {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    font-size: 13px;
    font-weight: 800;
    padding: 8px 18px;
    border-radius: 50px;
    box-shadow: 0 4px 12px rgba(212,175,55,0.3);
    font-family: 'Playfair Display', serif;
}

/* FILTER BAR */
.filter-bar {
    background: #fff;
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-items: end;
}
.filter-bar label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
    margin-bottom: 5px;
}
.filter-bar select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    background: #fafbff;
    font-size: 13.5px;
    outline: none;
    transition: 0.25s;
    font-family: inherit;
    font-weight: 600;
    color: var(--navy);
}
.filter-bar select:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.06);
    background: #fff;
}

/* STATS */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.stat-pill {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    transition: 0.3s;
}
.stat-pill:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.stat-pill .sp-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}
.stat-pill .sp-icon.exam { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
.stat-pill .sp-icon.holiday { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
.stat-pill .sp-icon.event { background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: #fff; }
.stat-pill .sp-icon.total { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--gold); }
.stat-pill .sp-info { min-width: 0; }
.stat-pill .sp-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.stat-pill .sp-label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
}

/* EVENTS LIST */
.events-list {
    display: grid;
    gap: 14px;
}
.event-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    display: flex;
    gap: 20px;
    align-items: flex-start;
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}
.event-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--navy);
}
.event-card.exam::before { background: linear-gradient(180deg, #dc2626, #ef4444); }
.event-card.holiday::before { background: linear-gradient(180deg, #059669, #10b981); }
.event-card.event::before { background: linear-gradient(180deg, #8b5cf6, #a78bfa); }
.event-card.result::before { background: linear-gradient(180deg, #f59e0b, #fbbf24); }
.event-card.admission::before { background: linear-gradient(180deg, #2563eb, #3b82f6); }
.event-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
}
.event-card.past { opacity: 0.65; }

.event-date-box {
    flex-shrink: 0;
    width: 80px;
    text-align: center;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-radius: 14px;
    padding: 12px 8px;
}
.event-card.exam .event-date-box { background: linear-gradient(135deg, #dc2626, #ef4444); }
.event-card.holiday .event-date-box { background: linear-gradient(135deg, #059669, #10b981); }
.event-card.event .event-date-box { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
.event-card.result .event-date-box { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
.event-card.admission .event-date-box { background: linear-gradient(135deg, #2563eb, #3b82f6); }

.event-date-box .day {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.event-date-box .month {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
    color: rgba(255,255,255,0.95);
    font-weight: 600;
}
.event-date-box .year {
    font-size: 10px;
    opacity: 0.8;
    margin-top: 2px;
}

.event-body { flex: 1; min-width: 0; }
.event-body h4 {
    font-size: 17px;
    color: var(--navy);
    margin: 0 0 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    line-height: 1.35;
}
.event-body p {
    font-size: 13.5px;
    color: var(--grey);
    margin: 0 0 10px;
    line-height: 1.65;
}
.event-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--grey);
    padding-top: 10px;
    border-top: 1px dashed var(--border);
}
.event-meta span { display: inline-flex; align-items: center; gap: 6px; }
.event-meta i { color: var(--gold-dark); }

.event-type-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
}
.event-type-badge.exam { background: #fef2f2; color: #991b1b; }
.event-type-badge.holiday { background: #dcfce7; color: #166534; }
.event-type-badge.event { background: #f3e8ff; color: #6b21a8; }
.event-type-badge.result { background: #fef3c7; color: #92400e; }
.event-type-badge.admission { background: #dbeafe; color: #1e40af; }
.event-type-badge.general { background: #f3f4f6; color: #374151; }

.event-status-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.event-status-badge.upcoming {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    box-shadow: 0 4px 12px rgba(212,175,55,0.35);
}
.event-status-badge.today {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 4px 12px rgba(16,185,129,0.4);
    animation: pulse-badge 2s infinite;
}
@keyframes pulse-badge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
}
.event-status-badge.past {
    background: #e5e7eb;
    color: #6b7280;
}

/* EMPTY STATE */
.empty-state {
    text-align: center;
    padding: 70px 20px;
    background: #fff;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}
.empty-state .icon-wrap {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, rgba(10,22,85,0.06), rgba(13,71,161,0.04));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
}
.empty-state i { font-size: 36px; color: var(--navy); opacity: 0.35; }
.empty-state h6 { color: #374151; font-weight: 700; font-size: 17px; margin-bottom: 8px; }
.empty-state p { font-size: 13.5px; color: var(--grey); margin: 0; }

/* LOADING */
.loading-card {
    background: #fff;
    border-radius: 20px;
    padding: 60px 20px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}
.loading-spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(10,22,85,0.1);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-card p { color: var(--grey); font-size: 13.5px; margin: 0; }

/* FOOTER */
.footer {
    text-align: center;
    padding: 30px 20px 40px;
    color: var(--grey);
    font-size: 12px;
}
.footer i { color: var(--gold-2); }
.footer .footer-line {
    max-width: 400px;
    margin: 0 auto 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(10,22,85,0.15), transparent);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .public-header { padding: 10px 14px; }
    .public-header h4 { font-size: 14px; }
    .hero { padding: 30px 16px 70px; }
    .hero h1 { font-size: 22px; }
    .hero p { font-size: 12.5px; }
    .hero .hero-icon { width: 64px; height: 64px; font-size: 26px; }
    .main-wrap { padding: 0 12px; margin-top: -45px; }

    .info-bar { padding: 14px 16px; border-radius: 16px; }
    .info-bar .ib-icon { width: 38px; height: 38px; font-size: 16px; }
    .info-bar .ib-title { font-size: 13.5px; }
    .info-bar .ib-count { padding: 6px 14px; font-size: 12px; }

    .filter-bar { padding: 14px; border-radius: 14px; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-pill { padding: 11px 13px; }
    .stat-pill .sp-icon { width: 34px; height: 34px; font-size: 14px; }
    .stat-pill .sp-value { font-size: 18px; }

    .event-card { padding: 16px 18px; gap: 14px; flex-wrap: wrap; }
    .event-date-box { width: 66px; padding: 9px 6px; }
    .event-date-box .day { font-size: 22px; }
    .event-date-box .month { font-size: 9.5px; }
    .event-body h4 { font-size: 15px; }
    .event-body p { font-size: 12.5px; }
    .event-meta { font-size: 11px; gap: 12px; }
    .event-status-badge { top: 10px; right: 10px; font-size: 9.5px; padding: 3px 9px; }
}

@media (max-width: 480px) {
    .filter-bar { grid-template-columns: 1fr; }
    .hero h1 { font-size: 19px; }
    .event-status-badge { position: static; display: inline-block; margin-bottom: 8px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="public-header">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
        <div>
            <h4>Academic Calendar</h4>
            <small>Fulbariya College</small>
        </div>
    </div>
    <a href="../index.html" class="btn-header">
        <i class="fas fa-home"></i> <span>Home</span>
    </a>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <div class="hero-icon"><i class="fas fa-calendar-alt"></i></div>
        <h1>একাডেমিক <span>ক্যালেন্ডার</span></h1>
        <p>পরীক্ষা, ছুটি, ইভেন্ট ও ফলাফল — সব এক জায়গায়</p>
    </div>
</section>

<!-- MAIN -->
<div class="main-wrap">

    <!-- INFO BAR -->
    <div class="info-bar">
        <div class="ib-left">
            <div class="ib-icon"><i class="fas fa-calendar-check"></i></div>
            <div>
                <p class="ib-title">Academic Events</p>
                <p class="ib-sub">সকল ইভেন্ট ও কার্যক্রম</p>
            </div>
        </div>
        <div class="ib-count" id="calendarCount">0</div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
        <div>
            <label>Year</label>
            <select id="calFilterYear">
                <option value="">All Years</option>
            </select>
        </div>
        <div>
            <label>Event Type</label>
            <select id="calFilterType">
                <option value="">All Types</option>
                <option value="exam">📝 পরীক্ষা</option>
                <option value="holiday">🏖️ ছুটি</option>
                <option value="event">🎉 ইভেন্ট</option>
                <option value="result">🏆 ফলাফল</option>
                <option value="admission">📋 ভর্তি</option>
                <option value="general">📌 সাধারণ</option>
            </select>
        </div>
        <div>
            <label>Time</label>
            <select id="calFilterTime">
                <option value="all">সব</option>
                <option value="upcoming">আসন্ন</option>
                <option value="past">অতীত</option>
            </select>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-pill">
            <div class="sp-icon total"><i class="fas fa-calendar-alt"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="calStatTotal">0</div>
                <div class="sp-label">Total</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon exam"><i class="fas fa-file-alt"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="calStatExam">0</div>
                <div class="sp-label">Exams</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon holiday"><i class="fas fa-umbrella-beach"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="calStatHoliday">0</div>
                <div class="sp-label">Holidays</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon event"><i class="fas fa-glass-cheers"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="calStatEvent">0</div>
                <div class="sp-label">Events</div>
            </div>
        </div>
    </div>

    <!-- Events List -->
    <div class="events-list" id="eventsList">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <p>লোড হচ্ছে...</p>
        </div>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-line"></div>
    <p><i class="fas fa-graduation-cap"></i> Fulbariya College · Academic Calendar</p>
    <p style="font-size: 11px; margin-top: 6px;">&copy; 2026 All rights reserved</p>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/session-helper.js"></script>
<script src="../js/academic-hub.js?v=3"></script>
</body>
</html>
