<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNCC Management - Fulbariya College</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --navy-3: #0d47a1;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --white: #ffffff;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --dark: #1f2937;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --border: rgba(0,0,0,0.06);
    --border-light: rgba(0,0,0,0.04);
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
    --shadow-md: 0 4px 16px rgba(10,22,85,0.08);
    --shadow-lg: 0 12px 40px rgba(10,22,85,0.12);
}

* { font-family: 'Hind Siliguri', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--off-white); margin: 0; color: var(--dark); }

/* ============ HEADER ============ */
.admin-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(10,22,85,0.2);
    flex-wrap: wrap;
    gap: 12px;
}
.admin-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.admin-header .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.admin-header .brand-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    border: 1px solid rgba(242,210,123,0.3);
    flex-shrink: 0;
}
.admin-header h4 { margin: 0; font-size: 16px; font-weight: 700; }
.admin-header small { font-size: 10.5px; opacity: 0.85; display: block; margin-top: 2px; }

.admin-header .user-box { display: flex; align-items: center; gap: 8px; }
.avatar-circle {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
    border: 2px solid rgba(242,210,123,0.4);
    flex-shrink: 0;
}
.btn-header {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}
.btn-header:hover {
    background: rgba(255,255,255,0.25);
    color: #fff;
    transform: translateY(-1px);
}

/* ============ MAIN ============ */
.main-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 60px;
}

.page-title {
    color: var(--navy);
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.page-title i { color: var(--gold-dark); }
.page-title .badge-total {
    background: linear-gradient(135deg, rgba(10,22,85,0.08), rgba(13,71,161,0.06));
    color: var(--navy);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 700;
    border: 1px solid rgba(10,22,85,0.1);
}
.page-sub { color: var(--grey); font-size: 12.5px; margin-bottom: 18px; }

/* ============ TOOLBAR ============ */
.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.btn-add {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 16px rgba(10,22,85,0.25);
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(10,22,85,0.35);
    color: #fff;
}
.btn-add i { color: var(--gold); }

/* ============ STATS ============ */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.stat-pill {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
}
.stat-pill .sp-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
}
.stat-pill .sp-icon.navy { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--gold); }
.stat-pill .sp-icon.gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--navy); }
.stat-pill .sp-icon.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.stat-pill .sp-icon.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
.stat-pill .sp-info { min-width: 0; }
.stat-pill .sp-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.stat-pill .sp-label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 3px;
}

/* ============ PI OFFICER SECTION ============ */
.pi-officer-card {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 24px;
}
.pi-officer-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(242,210,123,0.15), transparent 70%);
    border-radius: 50%;
}
.pi-officer-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--gold-2), var(--gold));
}
.pi-officer-card .pi-badge {
    position: absolute;
    top: 16px; right: 20px;
    background: rgba(242,210,123,0.2);
    color: var(--gold);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 50px;
    border: 1px solid rgba(242,210,123,0.3);
    z-index: 2;
}
.pi-officer-card .pi-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
    box-shadow: 0 8px 24px rgba(242,210,123,0.4);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    background: var(--off-white);
}
.pi-officer-card .pi-info {
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 1;
}
.pi-officer-card .pi-info .pi-designation {
    display: inline-block;
    background: rgba(242,210,123,0.2);
    color: var(--gold);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 50px;
    margin-bottom: 8px;
    border: 1px solid rgba(242,210,123,0.3);
}
.pi-officer-card .pi-info h3 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    color: #fff;
}
.pi-officer-card .pi-info .pi-name-en {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 8px;
}
.pi-officer-card .pi-info .pi-contact {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12.5px;
    opacity: 0.9;
}
.pi-officer-card .pi-info .pi-contact span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}
.pi-officer-card .pi-info .pi-contact i { color: var(--gold); }
.pi-officer-card .pi-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
}
.pi-officer-card .pi-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}
.pi-officer-card .pi-btn:hover {
    background: var(--gold);
    color: var(--navy);
    border-color: var(--gold);
    transform: translateY(-2px);
}
.pi-officer-card .pi-empty {
    flex: 1;
    text-align: center;
    padding: 20px;
    position: relative;
    z-index: 1;
}
.pi-officer-card .pi-empty i {
    font-size: 42px;
    color: var(--gold);
    opacity: 0.4;
    margin-bottom: 10px;
}
.pi-officer-card .pi-empty p {
    margin: 0 0 14px;
    font-size: 14px;
    opacity: 0.85;
}
.pi-officer-card .pi-empty .btn-pi-add {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    border: none;
    padding: 10px 22px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
}
.pi-officer-card .pi-empty .btn-pi-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(242,210,123,0.4);
}

/* ============ FORM CARD ============ */
.form-card {
    background: #fff;
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow-md);
    margin-bottom: 20px;
    display: none;
    border: 1px solid var(--border);
    animation: slideDown 0.4s ease;
}
.form-card.show { display: block; }
@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

.form-title {
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
}
.form-title i { color: var(--gold-dark); }

.form-label {
    font-weight: 600;
    font-size: 12px;
    color: #4b5563;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
}
.form-label .req { color: var(--danger); }

.form-control, .form-select {
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    padding: 10px 14px;
    font-size: 13.5px;
    transition: 0.25s;
    background: #fafbff;
    width: 100%;
}
.form-control:focus, .form-select:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.08);
    background: #fff;
    outline: none;
}

/* ============ UPLOAD ============ */
.upload-zone {
    border: 2px dashed #c8cdda;
    border-radius: 14px;
    padding: 22px 18px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
    background: #fafbff;
}
.upload-zone:hover {
    border-color: var(--navy);
    background: #f5f7ff;
}
.upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    z-index: 10;
}
.upload-zone .upload-icon {
    font-size: 36px;
    color: var(--navy);
    opacity: 0.3;
    pointer-events: none;
}
.upload-zone .upload-text {
    font-size: 13px;
    color: #666;
    margin-top: 8px;
    pointer-events: none;
}
.upload-zone .upload-text strong { color: var(--navy); }
.upload-zone .file-types {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
    pointer-events: none;
}

.image-preview {
    display: none;
    margin-top: 14px;
    padding: 12px;
    background: #f8f9ff;
    border-radius: 12px;
    border: 1.5px solid var(--border-light);
    position: relative;
    text-align: center;
}
.image-preview.show { display: block; }
.image-preview img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    margin: 0 auto;
    border: 3px solid var(--navy);
    background: #eee;
}
.image-preview .remove-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    border: 2px solid #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    box-shadow: 0 4px 12px rgba(239,68,68,0.4);
    transition: 0.25s;
}
.image-preview .remove-btn:hover {
    transform: scale(1.1) rotate(90deg);
}

/* ============ SWITCH ============ */
.form-check-input {
    width: 42px;
    height: 22px;
    cursor: pointer;
    accent-color: var(--navy);
    margin-top: 0;
}
.form-check-label {
    font-weight: 600;
    font-size: 13px;
    color: var(--dark);
    cursor: pointer;
}

/* ============ BUTTONS ============ */
.btn-primary-grad {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border: none;
    padding: 11px 26px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 16px rgba(10,22,85,0.2);
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.btn-primary-grad:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(10,22,85,0.3);
    color: #fff;
}
.btn-primary-grad:disabled { opacity: 0.6; cursor: not-allowed; }

.btn-secondary-grad {
    background: #f3f4f6;
    color: #374151;
    border: 1.5px solid var(--border);
    padding: 11px 22px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.btn-secondary-grad:hover { background: #e5e7eb; }

/* ============ FILTER ============ */
.filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
}
.filter-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    flex: 1;
    min-width: 200px;
    scrollbar-width: none;
}
.filter-scroll::-webkit-scrollbar { display: none; }
.filter-chip {
    padding: 7px 14px;
    border-radius: 50px;
    border: 1.5px solid #e5e7eb;
    background: #fff;
    color: var(--grey);
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    flex-shrink: 0;
}
.filter-chip:hover { border-color: var(--navy); color: var(--navy); }
.filter-chip.active {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(10,22,85,0.2);
}
.filter-chip i { font-size: 10px; }

.search-wrap {
    position: relative;
    min-width: 220px;
}
.search-wrap i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--grey-light);
    font-size: 13px;
}
.search-input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border-radius: 50px;
    border: 1.5px solid #e5e7eb;
    background: #fff;
    font-size: 12.5px;
    outline: none;
    transition: 0.25s;
}
.search-input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.06);
}

/* ============ MEMBER GRID ============ */
.members-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}

.member-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: all 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    border: 1px solid var(--border-light);
    position: relative;
}
.member-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: rgba(10,22,85,0.12);
}
.member-card .mc-img-wrap {
    width: 100%;
    height: 200px;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}
.member-card .mc-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.member-card .mc-img-wrap .mc-placeholder {
    font-size: 60px;
    color: rgba(242,210,123,0.4);
}

.member-card .mc-body {
    padding: 14px 16px 16px;
    text-align: center;
}
.member-card .mc-body h4 {
    font-size: 15px;
    color: var(--navy);
    font-weight: 700;
    margin-bottom: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.member-card .mc-body .mc-designation {
    font-size: 11px;
    color: var(--gold-dark);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
}
.member-card .mc-body .mc-phone {
    font-size: 11.5px;
    color: var(--grey);
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.member-card .mc-body .mc-phone i { color: var(--gold-dark); font-size: 10px; }

.member-card .mc-actions {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--border-light);
    background: #fafbff;
}
.member-card .mc-actions .btn-action {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.member-card .mc-actions .btn-edit { background: #e3f2fd; color: #1565c0; }
.member-card .mc-actions .btn-edit:hover { background: #bbdefb; transform: scale(1.08); }
.member-card .mc-actions .btn-delete { background: #fef2f2; color: var(--danger); }
.member-card .mc-actions .btn-delete:hover { background: #fecaca; transform: scale(1.08); }
.member-card .mc-actions .btn-toggle { background: #fef3c7; color: #d97706; }
.member-card .mc-actions .btn-toggle:hover { background: #fde68a; transform: scale(1.08); }

.member-card .mc-status {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    z-index: 2;
}
.member-card .mc-status.active { background: #10b981; color: #fff; box-shadow: 0 2px 8px rgba(16,185,129,0.4); }
.member-card .mc-status.inactive { background: #6b7280; color: #fff; }

.member-card .mc-badge-officer {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    z-index: 2;
    box-shadow: 0 2px 8px rgba(242,210,123,0.5);
}

/* ============ EMPTY ============ */
.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid var(--border-light);
}
.empty-state .icon-wrap {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, rgba(10,22,85,0.06), rgba(13,71,161,0.04));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
}
.empty-state i { font-size: 30px; color: var(--navy); opacity: 0.4; }
.empty-state h6 { color: #374151; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.empty-state p { font-size: 13px; margin: 0; }

/* ============ SKELETON ============ */
.skeleton-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border-light);
}
.skeleton-thumb {
    width: 100%;
    height: 200px;
    background: linear-gradient(90deg, #f0f2f5 25%, #e5e7eb 50%, #f0f2f5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
}
.skeleton-body { padding: 14px 16px; }
.skeleton-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, #f0f2f5 25%, #e5e7eb 50%, #f0f2f5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    margin-bottom: 10px;
}
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* ============ TOAST ============ */
#toastContainer {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 340px;
}
.toast-msg {
    padding: 13px 20px;
    border-radius: 12px;
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    min-width: 220px;
    animation: slideIn 0.35s ease;
    display: flex;
    align-items: center;
    gap: 10px;
}
.toast-success { background: linear-gradient(135deg, #10b981, #059669); }
.toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
.toast-info { background: linear-gradient(135deg, #3b82f6, #2563eb); }

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
}

/* ============ SMART MODAL ============ */
.smart-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 40, 0.65);
    backdrop-filter: blur(6px);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.25s ease;
}
.smart-modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.smart-modal {
    background: #fff;
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
    padding: 30px 26px 24px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
    animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
}
.smart-modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--navy), var(--gold), var(--navy));
}
@keyframes modalPop {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}
.smart-modal .modal-icon {
    width: 70px; height: 70px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 16px;
}
.smart-modal .modal-icon.warn {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    color: var(--danger);
}
.smart-modal h5 {
    font-weight: 700;
    color: #1f2937;
    font-size: 18px;
    margin-bottom: 8px;
}
.smart-modal p {
    color: var(--grey);
    font-size: 13.5px;
    margin-bottom: 22px;
    line-height: 1.6;
}
.smart-modal .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
}
.smart-modal .modal-btn {
    padding: 11px 26px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    border: none;
    transition: 0.25s;
    min-width: 110px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
}
.smart-modal .modal-btn.cancel { background: #f3f4f6; color: #374151; }
.smart-modal .modal-btn.cancel:hover { background: #e5e7eb; }
.smart-modal .modal-btn.danger {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    box-shadow: 0 4px 14px rgba(239,68,68,0.3);
}
.smart-modal .modal-btn.danger:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(239,68,68,0.4);
}

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
    .admin-header { padding: 10px 14px; }
    .admin-header h4 { font-size: 14px; }
    .admin-header .brand-icon { width: 38px; height: 38px; font-size: 16px; }
    .main-wrap { padding: 14px 12px 50px; }

    .toolbar { flex-direction: column; align-items: stretch; }

    .stats-row { gap: 8px; }
    .stat-pill { padding: 11px 12px; }
    .stat-pill .sp-icon { width: 34px; height: 34px; font-size: 13px; }
    .stat-pill .sp-value { font-size: 17px; }

    .search-wrap { min-width: unset; width: 100%; }
    .filter-bar { flex-direction: column; align-items: stretch; }

    .pi-officer-card {
        padding: 20px;
        flex-direction: column;
        text-align: center;
        gap: 16px;
    }
    .pi-officer-card .pi-img { width: 90px; height: 90px; }
    .pi-officer-card .pi-info h3 { font-size: 18px; }
    .pi-officer-card .pi-info .pi-contact { justify-content: center; }
    .pi-officer-card .pi-actions { justify-content: center; }
    .pi-officer-card .pi-badge { top: 12px; right: 12px; font-size: 9px; }

    .members-grid {

        gap: 12px;
    }
    .member-card .mc-img-wrap { height: 160px; }

}

        </a>
        <button class="btn-header" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>

</header>

<!-- MAIN -->
<div class="main-wrap">

    <!-- Toolbar -->
    <div class="toolbar">
        <div>
            <h4 class="page-title">
                <i class="fas fa-flag"></i> BNCC Members
                <span class="badge-total" id="totalMembers">0</span>
            </h4>
            <p class="page-sub">বাংলাদেশ ন্যাশনাল ক্যাডেট কোর — অফিসার ও সদস্য</p>

    <!-- Stats -->
    <div class="stats-row">

                <div class="sp-value" id="statTotal">0</div>

            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon gold"><i class="fas fa-user-tie"></i></div>

        <div class="stat-pill">

    <!-- PI Officer Card -->
    <div class="pi-officer-card" id="piOfficerCard">
        <!-- Content loaded by JS -->
    </div>

    <!-- Add/Edit Form -->
    <div class="form-card" id="memberFormCard">
        <div class="form-title">
            <i class="fas fa-user-plus"></i> <span id="formTitle">Add New Member</span>
        </div>

        <form id="memberForm">
            <input type="hidden" id="memberId" value="">
            <input type="hidden" id="existingImageUrl" value="">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">নাম <span class="req">*</span></label>

                <div class="col-md-6">

                    <input type="text" class="form-control" id="nameEn" placeholder="e.g. Md. Rafiqul Islam">
                </div>

                <div class="col-md-6">
                    <label class="form-label">পদবী <span class="req">*</span></label>
                    <input type="text" class="form-control" id="designation" placeholder="যেমন: PI Officer / Cadet / Corporal" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Member Type <span class="req">*</span></label>
                    <select class="form-select" id="memberType">
                        <option value="member">Member (সদস্য)</option>

                        <div class="file-types">JPG, PNG, WEBP</div>
                        <input type="file" id="imageInput" accept="image/*">

                    <div class="image-preview" id="imagePreview">
                        <img id="previewImg" src="" alt="Preview">
                        <button type="button" class="remove-btn" id="removeImage">
                            <i class="fas fa-times"></i>

        </div>
        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search by name...">

    <!-- Members Grid -->
    <div class="members-grid" id="membersGrid">
        <div class="skeleton-card">
            <div class="skeleton-thumb"></div>
            <div class="skeleton-body">
                <div class="skeleton-line" style="width:80%;"></div>
                <div class="skeleton-line" style="width:60%;"></div>

        <div class="skeleton-card">
            <div class="skeleton-thumb"></div>
            <div class="skeleton-body">
                <div class="skeleton-line" style="width:75%;"></div>
                <div class="skeleton-line" style="width:55%;"></div>

            <div class="skeleton-thumb"></div>
            <div class="skeleton-body">

</div>

<!-- Toast -->
<div id="toastContainer"></div>

<!-- Smart Modal -->
<div class="smart-modal-overlay" id="smartModal">
    <div class="smart-modal">
        <div class="modal-icon warn"><i class="fas fa-trash-alt"></i></div>
        <h5 id="smartModalTitle">Delete Member?</h5>
        <p id="smartModalText">This action cannot be undone.</p>
        <div class="modal-actions">
            <button class="modal-btn cancel" id="smartModalCancel">Cancel</button>
            <button class="modal-btn danger" id="smartModalConfirm">Delete</button>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cloudinary.js"></script>
<script src="../js/notification-helper.js"></script>
<script src="../js/notification-ui.js"></script>
<script>
(function () {
    "use strict";

    // =========================================================
    // STATE
    // =========================================================
    let allMembers = [];
    let editingId = null;
    let selectedImageFile = null;
    let currentFilter = 'all';
    let searchQuery = '';

    const grid = document.getElementById('membersGrid');

    // =========================================================
    // HELPERS
    // =========================================================
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(msg, type) {
        type = type || 'success';
        let c = document.getElementById('toastContainer');
        if (!c) {
            c = document.createElement('div');
            c.id = 'toastContainer';
            document.body.appendChild(c);
        }
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
        const t = document.createElement('div');
        t.className = 'toast-msg toast-' + type;
        t.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> <span>' + msg + '</span>';
        c.appendChild(t);
        setTimeout(function () {
            t.style.animation = 'slideOut 0.35s ease';
            setTimeout(function () { t.remove(); }, 350);
        }, 3500);
    }

    // =========================================================
    // SMART MODAL
    // =========================================================
    let modalResolver = null;
    function showConfirm(title, message) {
        return new Promise(function (resolve) {
            modalResolver = resolve;
            document.getElementById('smartModalTitle').textContent = title;
            document.getElementById('smartModalText').textContent = message;
            document.getElementById('smartModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        });
    }
    function closeConfirm(result) {
        document.getElementById('smartModal').classList.remove('show');
        document.body.style.overflow = '';
        if (modalResolver) { modalResolver(result); modalResolver = null; }
    }
    document.getElementById('smartModalConfirm').addEventListener('click', function () { closeConfirm(true); });
    document.getElementById('smartModalCancel').addEventListener('click', function () { closeConfirm(false); });
    document.getElementById('smartModal').addEventListener('click', function (e) {
        if (e.target.id === 'smartModal') closeConfirm(false);
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && document.getElementById('smartModal').classList.contains('show')) {
            closeConfirm(false);
        }
    });

    // =========================================================
    // ADMIN INFO
    // =========================================================
    async function loadAdminInfo() {
        try {
            const result = await window.FDCAuth.getCurrentAdmin();
            if (result && result.admin) {
                const avatar = document.querySelector('[data-admin-avatar]');
                if (avatar) {
                    avatar.textContent = (result.admin.name || 'A').charAt(0).toUpperCase();
                }
            }
        } catch (e) { console.warn('Admin info error:', e); }
    }

    window.handleLogout = async function () {
        const ok = await showConfirm('Logout', 'আপনি কি লগআউট করতে চান?');
        if (!ok) return;
        try {
            await window.FDCAuth.logout();
            window.location.replace('admin-login.html');
        } catch (e) { console.error(e); }
    };

    // =========================================================
    // WAIT FOR SUPABASE
    // =========================================================
    function waitForSupabase(cb) {
        if (window.FDC_SUPABASE_READY && window.FDC_SUPABASE) return cb();
        window.addEventListener('fdc:supabase-ready', cb);
        let n = 0;
        const i = setInterval(function () {
            if (window.FDC_SUPABASE_READY && window.FDC_SUPABASE) {
                clearInterval(i); cb();
            }
            if (++n > 20) { clearInterval(i); showToast('Connection timeout', 'error'); }
        }, 500);
    }

    // =========================================================
    // IMAGE UPLOAD
    // =========================================================
    function setupImageUpload() {
        const dropArea = document.getElementById('imageDropArea');
        const fileInput = document.getElementById('imageInput');
        const preview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const removeBtn = document.getElementById('removeImage');

        if (!dropArea || !fileInput) return;

        fileInput.addEventListener('change', function () {
            if (this.files && this.files.length > 0) handleImageSelect(this.files[0]);
        });

        dropArea.addEventListener('dragover', function (e) {
            e.preventDefault();
            this.style.borderColor = '#1a237e';
            this.style.background = '#f5f7ff';
        });
        dropArea.addEventListener('dragleave', function (e) {
            e.preventDefault();
            this.style.borderColor = '#c8cdda';
            this.style.background = '#fafbff';
        });
        dropArea.addEventListener('drop', function (e) {
            e.preventDefault();
            this.style.borderColor = '#c8cdda';
            this.style.background = '#fafbff';
            if (e.dataTransfer.files.length > 0) {
                handleImageSelect(e.dataTransfer.files[0]);
                const dt = new DataTransfer();
                dt.items.add(e.dataTransfer.files[0]);
                fileInput.files = dt.files;
            }
        });

        if (removeBtn) {
            removeBtn.addEventListener('click', function () {
                selectedImageFile = null;
                fileInput.value = '';
                preview.classList.remove('show');
                document.getElementById('existingImageUrl').value = '';
                showToast('Image removed', 'info');
            });
        }
    }

    function handleImageSelect(file) {
        if (!file) return;
        if (file.size > 3 * 1024 * 1024) {
            showToast('Image too large! Max 3MB', 'error');
            document.getElementById('imageInput').value = '';
            return;
        }
        if (!file.type.startsWith('image/')) {
            showToast('Only images allowed', 'error');
            return;
        }
        selectedImageFile = file;
        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById('previewImg').src = e.target.result;
            document.getElementById('imagePreview').classList.add('show');
        };
        reader.readAsDataURL(file);
        showToast('Image selected', 'success');
    }

    // =========================================================
    // LOAD ALL MEMBERS
    // =========================================================
    async function loadAllMembers() {
        try {
            if (!window.FDC_SUPABASE_READY) {
                await new Promise(function (r) {
                    if (window.FDC_SUPABASE_READY) return r();
                    document.addEventListener('fdc:supabase-ready', r, { once: true });
                    setTimeout(r, 10000);
                });
            }

            const supabase = window.FDC_SUPABASE;
            const { data, error } = await supabase
                .from('bncc_members')
                .select('*')
                .order('member_type', { ascending: true })
                .order('display_order', { ascending: true })
                .order('created_at', { ascending: false });

            if (error) throw error;

            allMembers = data || [];
            console.log('✅ Loaded members:', allMembers.length);

            updateStats();
            renderPiOfficer();
            renderMembers();

        } catch (err) {
            console.error('❌ Load error:', err);
            grid.innerHTML = '<div class="empty-state"><div class="icon-wrap"><i class="fas fa-exclamation-circle"></i></div><h6>Failed to load</h6><p>' + escapeHtml(err.message) + '</p></div>';
        }
    }

    // =========================================================
    // UPDATE STATS
    // =========================================================
    function updateStats() {
        const total = allMembers.length;
        const officer = allMembers.filter(function (m) { return m.member_type === 'officer'; }).length;
        const members = allMembers.filter(function (m) { return m.member_type !== 'officer'; }).length;
        const active = allMembers.filter(function (m) { return m.is_active; }).length;

        document.getElementById('totalMembers').textContent = total;
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statOfficer').textContent = officer;
        document.getElementById('statMembers').textContent = members;
        document.getElementById('statActive').textContent = active;
    }

    // =========================================================
    // RENDER PI OFFICER
    // =========================================================
    function renderPiOfficer() {
        const card = document.getElementById('piOfficerCard');
        const officer = allMembers.find(function (m) { return m.member_type === 'officer'; });

        if (!officer) {
            card.innerHTML = '<div class="pi-empty">' +
                '<i class="fas fa-user-tie"></i>' +
                '<p>PI Officer যোগ করা হয়নি</p>' +
                '<button class="btn-pi-add" onclick="window.showAddOfficer()">' +
                    '<i class="fas fa-plus"></i> Add PI Officer' +
                '</button>' +
            '</div>';
            return;
        }

        const img = officer.image_url || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23f8f9fc%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%230a1655%22 font-size=%2240%22 text-anchor=%22middle%22 dy=%22.35em%22%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E';

        let contact = '';
        if (officer.phone) {
            contact += '<span><i class="fas fa-phone"></i> ' + escapeHtml(officer.phone) + '</span>';
        }

        card.innerHTML =
            '<span class="pi-badge">⭐ PI Officer</span>' +
            '<img src="' + escapeHtml(img) + '" alt="' + escapeHtml(officer.name) + '" class="pi-img" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23f8f9fc%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E\'">' +
            '<div class="pi-info">' +
                '<span class="pi-designation">' + escapeHtml(officer.designation || 'PI Officer') + '</span>' +
                '<h3>' + escapeHtml(officer.name) + '</h3>' +
                (officer.name_en ? '<div class="pi-name-en">' + escapeHtml(officer.name_en) + '</div>' : '') +
                (contact ? '<div class="pi-contact">' + contact + '</div>' : '') +
            '</div>' +
            '<div class="pi-actions">' +
                '<button class="pi-btn" onclick="window.editMember(\'' + officer.id + '\')" title="Edit">' +
                    '<i class="fas fa-edit"></i>' +
                '</button>' +
                '<button class="pi-btn" onclick="window.deleteMember(\'' + officer.id + '\')" title="Delete">' +
                    '<i class="fas fa-trash"></i>' +
                '</button>' +
            '</div>';
    }

    // =========================================================
    // RENDER MEMBERS GRID
    // =========================================================
    function renderMembers() {
        let filtered = allMembers.filter(function (m) {
            // Officer always shown in PI card — exclude from grid? No, show in grid too but tagged
            if (currentFilter === 'officer' && m.member_type !== 'officer') return false;
            if (currentFilter === 'member' && m.member_type === 'officer') return false;
            if (currentFilter === 'inactive' && m.is_active) return false;
            if (currentFilter === 'all' && !m.is_active && false) return false; // show inactive too in "all"

            if (searchQuery) {
                const text = (m.name + ' ' + (m.name_en || '') + ' ' + (m.designation || '')).toLowerCase();
                if (!text.includes(searchQuery)) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-state">' +
                '<div class="icon-wrap"><i class="fas fa-users"></i></div>' +
                '<h6>কোনো সদস্য নেই</h6>' +
                '<p>Click "Add New Member" to create one</p>' +
            '</div>';
            return;
        }

        let html = '';
        filtered.forEach(function (m) {
            const img = m.image_url
                ? '<img src="' + escapeHtml(m.image_url) + '" alt="' + escapeHtml(m.name) + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">'
                : '';
            const placeholder = '<div class="mc-placeholder" style="display:' + (m.image_url ? 'none' : 'flex') + ';"><i class="fas fa-user"></i></div>';

            const statusBadge = m.is_active
                ? '<span class="mc-status active">Active</span>'
                : '<span class="mc-status inactive">Inactive</span>';

            const officerBadge = m.member_type === 'officer'
                ? '<span class="mc-badge-officer">Officer</span>'
                : '';

            const phoneHtml = m.phone
                ? '<div class="mc-phone"><i class="fas fa-phone"></i> ' + escapeHtml(m.phone) + '</div>'
                : '';

            html += '<div class="member-card">' +
                officerBadge +
                statusBadge +
                '<div class="mc-img-wrap">' +
                    img + placeholder +
                '</div>' +
                '<div class="mc-body">' +
                    '<h4>' + escapeHtml(m.name) + '</h4>' +
                    '<div class="mc-designation">' + escapeHtml(m.designation || 'Member') + '</div>' +
                    phoneHtml +
                '</div>' +
                '<div class="mc-actions">' +
                    '<button class="btn-action btn-toggle" onclick="window.toggleActive(\'' + m.id + '\')" title="Toggle Status">' +
                        '<i class="fas fa-' + (m.is_active ? 'eye-slash' : 'eye') + '"></i>' +
                    '</button>' +
                    '<button class="btn-action btn-edit" onclick="window.editMember(\'' + m.id + '\')" title="Edit">' +
                        '<i class="fas fa-edit"></i>' +
                    '</button>' +
                    '<button class="btn-action btn-delete" onclick="window.deleteMember(\'' + m.id + '\')" title="Delete">' +
                        '<i class="fas fa-trash"></i>' +
                    '</button>' +
                '</div>' +
            '</div>';
        });
        grid.innerHTML = html;
    }

    // =========================================================
    // SHOW ADD FORM
    // =========================================================
    function showAddForm(presetType) {
        editingId = null;
        selectedImageFile = null;

        document.getElementById('memberId').value = '';
        document.getElementById('formTitle').textContent = 'Add New Member';
        document.getElementById('submitBtnText').textContent = 'Save Member';
        document.getElementById('memberForm').reset();
        document.getElementById('existingImageUrl').value = '';
        document.getElementById('imagePreview').classList.remove('show');
        document.getElementById('imageInput').value = '';
        document.getElementById('isActive').checked = true;
        document.getElementById('displayOrder').value = 0;

        if (presetType === 'officer') {
            document.getElementById('memberType').value = 'officer';
            document.getElementById('designation').value = 'PI Officer';
        } else {
            document.getElementById('memberType').value = 'member';
        }

        const card = document.getElementById('memberFormCard');
        card.classList.add('show');
        setTimeout(function () {
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    window.showAddOfficer = function () {
        // Check if officer already exists
        const existing = allMembers.find(function (m) { return m.member_type === 'officer'; });
        if (existing) {
            showToast('PI Officer already exists. Edit the existing one.', 'error');
            return;
        }
        showAddForm('officer');
    };

    // =========================================================
    // EDIT MEMBER
    // =========================================================
    window.editMember = async function (id) {
        try {
            const { data, error } = await window.FDC_SUPABASE
                .from('bncc_members').select('*').eq('id', id).single();
            if (error) throw error;

            editingId = id;
            selectedImageFile = null;

            document.getElementById('memberId').value = data.id;
            document.getElementById('name').value = data.name || '';
            document.getElementById('nameEn').value = data.name_en || '';
            document.getElementById('designation').value = data.designation || '';
            document.getElementById('memberType').value = data.member_type || 'member';
            document.getElementById('phone').value = data.phone || '';
            document.getElementById('bio').value = data.bio || '';
            document.getElementById('displayOrder').value = data.display_order || 0;
            document.getElementById('isActive').checked = !!data.is_active;
            document.getElementById('existingImageUrl').value = data.image_url || '';

            if (data.image_url) {
                document.getElementById('previewImg').src = data.image_url;
                document.getElementById('imagePreview').classList.add('show');
            } else {
                document.getElementById('imagePreview').classList.remove('show');
            }

            document.getElementById('imageInput').value = '';
            document.getElementById('formTitle').textContent = 'Edit Member';
            document.getElementById('submitBtnText').textContent = 'Update Member';

            const card = document.getElementById('memberFormCard');
            card.classList.add('show');
            setTimeout(function () {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);

        } catch (e) {
            console.error('Edit error:', e);
            showToast('Failed to load: ' + e.message, 'error');
        }
    };

    // =========================================================
    // DELETE MEMBER
    // =========================================================
    window.deleteMember = async function (id) {
        const item = allMembers.find(function (m) { return m.id === id; });
        if (!item) return;

        const ok = await showConfirm('Delete Member?', '"' + item.name + '" কে স্থায়ীভাবে মুছে ফেলা হবে।');
        if (!ok) return;

        try {
            const { error } = await window.FDC_SUPABASE.from('bncc_members').delete().eq('id', id);
            if (error) throw error;
            showToast('Member deleted!', 'success');
            await loadAllMembers();
        } catch (e) {
            showToast('Failed: ' + e.message, 'error');
        }
    };

    // =========================================================
    // TOGGLE ACTIVE
    // =========================================================
    window.toggleActive = async function (id) {
        const item = allMembers.find(function (m) { return m.id === id; });
        if (!item) return;

        const newState = !item.is_active;
        try {
            const { error } = await window.FDC_SUPABASE
                .from('bncc_members')
                .update({ is_active: newState, updated_at: new Date().toISOString() })
                .eq('id', id);
            if (error) throw error;
            item.is_active = newState;
            showToast(newState ? '✅ Active করা হয়েছে' : '⚠️ Deactivate করা হয়েছে', 'success');
            updateStats();
            renderMembers();
        } catch (e) {
            showToast('Failed: ' + e.message, 'error');
        }
    };

    // =========================================================
    // FORM SUBMIT
    // =========================================================
    document.getElementById('memberForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const id = document.getElementById('memberId').value;
        const name = document.getElementById('name').value.trim();
        const name_en = document.getElementById('nameEn').value.trim();
        const designation = document.getElementById('designation').value.trim();
        const member_type = document.getElementById('memberType').value;
        const phone = document.getElementById('phone').value.trim();
        const bio = document.getElementById('bio').value.trim();
        const display_order = parseInt(document.getElementById('displayOrder').value) || 0;
        const is_active = document.getElementById('isActive').checked;
        const existingImageUrl = document.getElementById('existingImageUrl').value;

        if (!name) { showToast('Name required', 'error'); return; }
        if (!designation) { showToast('Designation required', 'error'); return; }

        // Check if adding an officer while another exists
        if (member_type === 'officer') {
            const existingOfficer = allMembers.find(function (m) {
                return m.member_type === 'officer' && m.id !== id;
            });
            if (existingOfficer) {
                showToast('PI Officer already exists. Only one allowed.', 'error');
                return;
            }
        }

        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const originalText = submitBtnText.textContent;
        submitBtn.disabled = true;
        submitBtnText.textContent = 'Saving...';

        try {
            let image_url = existingImageUrl;

            if (selectedImageFile) {
                if (typeof window.FDCUploadImage !== 'function') {
                    throw new Error('Upload function not available');
                }
                submitBtnText.textContent = 'Uploading...';
                const result = await window.FDCUploadImage(selectedImageFile);
                image_url = result.url || result.secure_url;
                showToast('Image uploaded', 'success');
            }

            const memberData = {
                name: name,
                name_en: name_en || null,
                designation: designation,
                image_url: image_url || null,
                member_type: member_type,
                phone: phone || null,
                bio: bio || null,
                display_order: display_order,
                is_active: is_active,
                updated_at: new Date().toISOString()
            };

            let result;
            if (id) {
                result = await window.FDC_SUPABASE.from('bncc_members').update(memberData).eq('id', id).select();
                showToast('Member updated!', 'success');
            } else {
                result = await window.FDC_SUPABASE.from('bncc_members').insert([memberData]).select();
                showToast('Member created!', 'success');
            }

            if (result.error) throw result.error;

            document.getElementById('memberFormCard').classList.remove('show');
            document.getElementById('memberForm').reset();
            document.getElementById('imagePreview').classList.remove('show');
            selectedImageFile = null;
            await loadAllMembers();

        } catch (err) {
            console.error('Save error:', err);
            showToast('Failed: ' + err.message, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtnText.textContent = originalText;
        }
    });

    // =========================================================
    // CANCEL FORM
    // =========================================================
    document.getElementById('cancelForm').addEventListener('click', function () {
        document.getElementById('memberFormCard').classList.remove('show');
        document.getElementById('memberForm').reset();
        document.getElementById('imagePreview').classList.remove('show');
        selectedImageFile = null;
    });

    document.getElementById('showAddForm').addEventListener('click', function () {
        showAddForm();
    });

    // =========================================================
    // FILTER + SEARCH
    // =========================================================
    document.querySelectorAll('.filter-chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
            document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderMembers();
        });
    });

    document.getElementById('searchInput').addEventListener('input', function () {
        searchQuery = this.value.toLowerCase().trim();
        renderMembers();
    });

    // =========================================================
    // INIT
    // =========================================================
    function init() {
        console.log('🚀 Admin BNCC initialized');
        setupImageUpload();

        waitForSupabase(async function () {
            const admin = await window.FDCAuth.requireAdmin();
            if (!admin) return;
            await loadAdminInfo();
            await loadAllMembers();
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    console.log('✅ admin-bncc initialized');

})();
</script>

</body>
</html>
