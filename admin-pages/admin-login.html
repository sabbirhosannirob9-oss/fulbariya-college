<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | Fulbariya Degree College</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #f2d27b;
            --gold-dark: #d8ad45;
            --navy-dark: #061d36;
            --navy-mid: #0b3156;
            --success: #28a745;
            --danger: #dc3545;
            --info: #17a2b8;
        }

        * {
            font-family: 'Hind Siliguri', sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #061d36 0%, #0b3156 50%, #061d36 100%);
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Effects */
        body::before {
            content: '';
            position: fixed;
            top: -30%; right: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(216,173,69,0.12), transparent 65%);
            pointer-events: none;
            animation: floatGlow 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%; left: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(59,130,246,0.12), transparent 65%);
            pointer-events: none;
            animation: floatGlow 8s ease-in-out infinite reverse;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        /* ============ LOGIN CARD ============ */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            padding: 40px 34px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ SHIELD ICON ============ */
        .shield-wrap {
            text-align: center;
            margin-bottom: 8px;
        }

        .shield-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            box-shadow: 0 15px 45px rgba(216, 173, 69, 0.4);
            font-size: 36px;
            color: var(--navy-dark);
            position: relative;
            animation: shieldPulse 2.8s infinite;
        }

        .shield-icon::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 28px;
            border: 2px solid rgba(242, 210, 123, 0.3);
            animation: ringPulse 2.8s infinite;
        }

        @keyframes shieldPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 15px 45px rgba(216, 173, 69, 0.4);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 20px 55px rgba(216, 173, 69, 0.55);
            }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.12); opacity: 0; }
        }

        /* ============ TITLES ============ */
        .login-card h1 {
            margin: 22px 0 4px;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-card h1 .highlight { color: var(--gold); }

        .college-name {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            margin: 0 0 4px;
            font-weight: 500;
        }

        .login-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 28px;
            font-weight: 600;
        }

        /* ============ DIVIDER ============ */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: rgba(255, 255, 255, 0.25);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ============ FORM ============ */
        .form-group { margin-bottom: 16px; }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-label i {
            color: var(--gold);
            font-size: 13px;
            width: 16px;
            text-align: center;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            padding: 13px 15px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s;
            width: 100%;
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(242, 210, 123, 0.12);
            color: #fff;
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.28);
            font-weight: 400;
        }

        .form-control:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .password-wrap { position: relative; }
        .password-wrap .form-control { padding-right: 46px; }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            transition: 0.2s;
        }

        .password-toggle:hover { color: var(--gold); }

        /* ============ REMEMBER ============ */
        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 20px;
            font-size: 13px;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            user-select: none;
        }

        .remember-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .forgot-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: 500;
            font-size: 12px;
            transition: 0.2s;
        }

        .forgot-link:hover { color: var(--gold); }

        /* ============ ALERT ============ */
        .alert-box {
            border-radius: 12px;
            padding: 12px 16px;
            display: none;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 500;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
        }

        .alert-box.show { display: flex; animation: shakeIn 0.4s ease; }

        @keyframes shakeIn {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .alert-box.error {
            background: rgba(220, 53, 69, 0.15);
            color: #ff8a8a;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .alert-box.success {
            background: rgba(40, 167, 69, 0.15);
            color: #7effa0;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .alert-box.info {
            background: rgba(23, 162, 184, 0.15);
            color: #7ee8ff;
            border: 1px solid rgba(23, 162, 184, 0.3);
        }

        /* ============ SUBMIT BUTTON ============ */
        .btn-login {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--navy-dark);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(216, 173, 69, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(216, 173, 69, 0.5);
        }

        .btn-login:active:not(:disabled) { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* ============ FOOTER ============ */
        .login-footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .login-footer a {
            color: var(--gold);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 14px;
            transition: 0.2s;
        }

        .login-footer a:hover { text-decoration: underline; }

        .security-note {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.7;
            margin: 0;
        }

        .security-note i { color: var(--gold); }

        /* ============ SESSION BANNER ============ */
        .session-banner {
            display: none;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(40, 167, 69, 0.12);
            border: 1px solid rgba(40, 167, 69, 0.3);
            margin-bottom: 18px;
            font-size: 12px;
            color: #7effa0;
            align-items: center;
            gap: 10px;
            line-height: 1.5;
        }

        .session-banner.show { display: flex; }

        .session-banner a {
            color: var(--gold);
            font-weight: 600;
            text-decoration: none;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 480px) {
            body { padding: 14px; }
            .login-card { padding: 30px 22px 24px; border-radius: 22px; }
            .shield-icon { width: 72px; height: 72px; font-size: 30px; border-radius: 20px; }
            .login-card h1 { font-size: 23px; }
            .form-control { font-size: 16px; padding: 12px 14px; }
            .form-group { margin-bottom: 14px; }
            .btn-login { padding: 14px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- SHIELD ICON -->
        <div class="shield-wrap">
            <div class="shield-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
        </div>

        <!-- TITLE -->
        <h1>ফুলবাড়ীয়া <span class="highlight">কলেজ</span></h1>
        <p class="college-name">Fulbariya Degree College</p>
        <p class="login-subtitle">Secure Administration Portal</p>

        <!-- SESSION BANNER -->
        <div class="session-banner" id="sessionBanner">
            <i class="fas fa-check-circle"></i>
            <span>
                আপনি ইতিমধ্যে লগইন আছেন। <a href="admin-dashboard.html">Dashboard-এ যান →</a>
            </span>
        </div>

        <div class="divider">Admin Login</div>

        <!-- FORM -->
        <form id="adminLoginForm" autocomplete="off">

            <!-- EMAIL -->
            <div class="form-group">
                <label class="form-label" for="adminEmail">
                    <i class="fas fa-envelope"></i>
                    <span>Admin Email</span>
                </label>
                <input type="email" 
                       class="form-control" 
                       id="adminEmail"
                       placeholder="admin@fulbariyacollege.com"
                       autocomplete="username"
                       required>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label class="form-label" for="adminPassword">
                    <i class="fas fa-lock"></i>
                    <span>পাসওয়ার্ড</span>
                </label>
                <div class="password-wrap">
                    <input type="password" 
                           class="form-control" 
                           id="adminPassword"
                           placeholder="আপনার পাসওয়ার্ড দিন"
                           autocomplete="current-password"
                           required>
                    <button type="button" 
                            class="password-toggle" 
                            id="passwordToggle"
                            aria-label="Show password">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <!-- REMEMBER + FORGOT -->
            <div class="remember-row">
                <label class="remember-check">
                    <input type="checkbox" id="rememberEmail">
                    <span>মনে রাখুন</span>
                </label>
                <a href="#" class="forgot-link" id="forgotLink">
                    পাসওয়ার্ড ভুলে গেছেন?
                </a>
            </div>

            <!-- ALERT -->
            <div class="alert-box" id="adminAlert"></div>

            <!-- SUBMIT -->
            <button type="submit" class="btn-login" id="adminLoginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="btnText">Login to Admin Panel</span>
            </button>

        </form>

        <!-- FOOTER -->
        <div class="login-footer">
            <a href="../index.html">
                <i class="fas fa-arrow-left"></i> Back to Website
            </a>
            <p class="security-note">
                <i class="fas fa-lock"></i> Authorized administrators only<br>
                Fulbariya Degree College · College Code 5215
            </p>
        </div>

    </div>

    <!-- SCRIPTS -->
<!-- 1. Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Config -->
<script src="../js/config.js"></script>

<!-- 3. Supabase client -->
<script src="../js/supabase.js"></script>

<!-- 4. Auth helper (নতুন) -->
<script src="../js/auth.js"></script>

<!-- 5. Admin login -->
<script src="../js/admin-login.js"></script>
</body>
</html>
