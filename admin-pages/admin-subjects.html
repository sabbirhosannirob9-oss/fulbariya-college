<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Management - Fulbariya College</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --dark: #1f2937;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
    --border-light: rgba(0,0,0,0.04);
    --border: rgba(0,0,0,0.08);
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
    --shadow-md: 0 4px 16px rgba(10,22,85,0.08);
}

* { font-family: 'Hind Siliguri', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--off-white); margin: 0; color: var(--dark); }

/* ================= HEADER ================= */
.admin-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(10,22,85,0.2);
    flex-wrap: wrap;
    gap: 12px;
}
.admin-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.admin-header .brand { display: flex; align-items: center; gap: 12px; }
.admin-header .brand-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    border: 1px solid rgba(242,210,123,0.3);
}
.admin-header h4 { margin: 0; font-size: 16px; font-weight: 700; }
.admin-header small { font-size: 10.5px; opacity: 0.85; display: block; margin-top: 2px; }
.admin-header .user-box { display: flex; align-items: center; gap: 8px; }
.avatar-circle {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
    border: 2px solid rgba(242,210,123,0.4);
    overflow: hidden;
}
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.btn-header {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}
.btn-header:hover { background: rgba(255,255,255,0.25); color: #fff; }

/* ================= MAIN ================= */
.main-wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }

.page-title {
    color: var(--navy);
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.page-title i { color: var(--gold-dark); }
.page-sub { color: var(--grey); font-size: 12.5px; margin-bottom: 18px; }

/* ================= TOOLBAR ================= */
.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.btn-primary-grad {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 16px rgba(10,22,85,0.25);
    display: inline-flex;
    align-items: center;
    gap: 7px;
}
.btn-primary-grad:hover:not(:disabled) { transform: translateY(-2px); color: #fff; }
.btn-primary-grad:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-primary-grad i { color: var(--gold); }

.btn-secondary {
    background: #fff;
    color: var(--navy);
    border: 1.5px solid #e5e7eb;
    padding: 9px 16px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.btn-secondary:hover { border-color: var(--navy); background: #f5f7ff; }

/* ================= FILTER ================= */
.filter-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    align-items: end;
}
.filter-card label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
    margin-bottom: 4px;
}
.filter-card select,
.filter-card input {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    background: #fafbff;
    font-size: 13px;
    outline: none;
    transition: 0.25s;
    font-family: inherit;
}
.filter-card select:focus,
.filter-card input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.06);
    background: #fff;
}

/* ================= STATS ================= */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
}
.stat-pill {
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
}
.stat-pill .sp-icon {
    width: 34px; height: 34px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
}
.stat-pill .sp-icon.navy { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--gold); }
.stat-pill .sp-icon.gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--navy); }
.stat-pill .sp-icon.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.stat-pill .sp-icon.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
.stat-pill .sp-icon.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
.stat-pill .sp-info { min-width: 0; }
.stat-pill .sp-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.stat-pill .sp-label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 3px;
}

/* ================= SECTIONS ================= */
.section-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 12px 18px;
    border-radius: 12px 12px 0 0;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    box-shadow: 0 4px 12px rgba(10,22,85,0.15);
}
.section-header.blue {
    background: linear-gradient(135deg, #1e40af, #3b82f6);
}
.section-header.purple {
    background: linear-gradient(135deg, #6b21a8, #8b5cf6);
}
.section-header .sh-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--gold);
}
.section-header .sh-title {
    flex: 1;
    font-size: 14.5px;
    font-weight: 700;
}
.section-header .sh-count {
    background: rgba(255,255,255,0.2);
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 11.5px;
    font-weight: 700;
}

.section-body {
    background: #fff;
    border-radius: 0 0 12px 12px;
    border: 1px solid var(--border-light);
    border-top: none;
    margin-bottom: 16px;
    overflow: hidden;
}

/* ================= TYPE GROUP ================= */
.type-group {
    border-bottom: 1px solid var(--border-light);
}
.type-group:last-child { border-bottom: none; }

.type-header {
    padding: 12px 18px;
    background: #fafbff;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    transition: 0.2s;
}
.type-header:hover { background: #f5f7ff; }
.type-header .th-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
}
.type-header .th-icon.compulsory { background: #dbeafe; color: #1e40af; }
.type-header .th-icon.group { background: #dcfce7; color: #166534; }
.type-header .th-icon.optional { background: #fef3c7; color: #92400e; }
.type-header .th-icon.trade { background: #f3e8ff; color: #6b21a8; }
.type-header .th-title {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
}
.type-header .th-count {
    background: rgba(10,22,85,0.08);
    color: var(--navy);
    padding: 2px 10px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 700;
}
.type-header .th-arrow {
    color: var(--grey);
    font-size: 12px;
    transition: 0.25s;
}
.type-group.expanded .type-header .th-arrow {
    transform: rotate(90deg);
}

.type-body {
    display: none;
    padding: 8px 12px 12px;
}
.type-group.expanded .type-body { display: block; }

/* ================= BOOK CARD ================= */
.book-card {
    background: #fff;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    margin-bottom: 8px;
    transition: 0.25s;
    overflow: hidden;
}
.book-card:hover { border-color: var(--navy); }
.book-card.inactive { opacity: 0.6; }

.book-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
}
.book-header:hover { background: #fafbff; }

.book-header .bh-expand {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: rgba(10,22,85,0.06);
    color: var(--navy);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
    transition: 0.25s;
}
.book-card.expanded .bh-expand {
    background: var(--navy);
    color: var(--gold);
    transform: rotate(90deg);
}

.book-header .bh-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
}

.book-header .bh-info { flex: 1; min-width: 0; }
.book-header .bh-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    line-height: 1.35;
}
.book-header .bh-subtitle {
    font-size: 11px;
    color: var(--grey);
    margin-top: 4px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.book-header .bh-subtitle span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.book-header .bh-subtitle i { color: var(--gold-dark); }

.book-header .bh-actions {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
}

/* ================= TAGS ================= */
.tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 50px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
}
.tag.branch-HSC { background: rgba(10,22,85,0.08); color: var(--navy); }
.tag.branch-BM { background: rgba(139,92,246,0.12); color: #6b21a8; }
.tag.class-badge { background: #e0e7ff; color: #3730a3; }
.tag.active-badge { background: #dcfce7; color: #166534; }
.tag.inactive-badge { background: #fee2e2; color: #991b1b; }

/* ================= BOOK BODY ================= */
.book-body {
    display: none;
    padding: 12px 16px 16px;
    background: #fafbff;
    border-top: 1px solid var(--border-light);
}
.book-card.expanded .book-body { display: block; }

/* ================= PAPER CARD ================= */
.paper-card {
    background: #fff;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    transition: 0.2s;
}
.paper-card:last-child { margin-bottom: 0; }
.paper-card.inactive { opacity: 0.55; }

.paper-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border-light);
}
.paper-header .ph-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
.paper-header .ph-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    display: flex;
    align-items: center;
    gap: 6px;
}
.paper-header .ph-name i { color: var(--gold-dark); }
.paper-header .ph-code {
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    background: rgba(10,22,85,0.08);
    color: var(--navy);
    padding: 2px 8px;
    border-radius: 5px;
    font-weight: 700;
}
.paper-header .ph-actions {
    display: flex;
    gap: 5px;
}

/* ================= MARKS GRID ================= */
.marks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
}
.mark-box {
    background: #fafbff;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
    transition: 0.2s;
}
.mark-box.active {
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border-color: #93c5fd;
}
.mark-box.muted {
    background: #f3f4f6;
    opacity: 0.6;
}
.mark-box .mb-label {
    font-size: 10px;
    color: var(--grey);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
}
.mark-box .mb-full {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    font-family: 'Playfair Display', serif;
    line-height: 1;
}
.mark-box .mb-pass {
    font-size: 10.5px;
    color: var(--success);
    font-weight: 700;
    margin-top: 4px;
}
.mark-box .mb-pass i {
    font-size: 8px;
    margin-right: 2px;
}

.paper-total {
    text-align: center;
    padding: 8px;
    font-size: 11.5px;
    color: var(--grey);
    border-top: 1px dashed var(--border-light);
    margin-top: 10px;
    padding-top: 10px;
}
.paper-total strong { color: var(--navy); font-size: 13px; }

/* ================= PAIR LINK ================= */
.pair-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
    color: #6b21a8;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 10.5px;
    font-weight: 700;
    margin-top: 8px;
}
.pair-link i { font-size: 10px; }

/* ================= ACTION BUTTONS ================= */
.action-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.action-btn:hover { transform: scale(1.08); }
.action-btn.edit { background: #e3f2fd; color: #1565c0; }
.action-btn.toggle { background: #dcfce7; color: #166534; }
.action-btn.toggle.off { background: #fef2f2; color: #dc2626; }
.action-btn.delete { background: #fef2f2; color: #dc2626; }

/* ================= EMPTY / LOADING ================= */
.empty-state {
    background: #fff;
    border-radius: 16px;
    padding: 60px 20px;
    text-align: center;
    border: 1px solid var(--border-light);
}
.empty-state .icon-wrap {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, rgba(10,22,85,0.06), rgba(13,71,161,0.04));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
}
.empty-state i { font-size: 36px; color: var(--navy); opacity: 0.35; }
.empty-state h6 { color: #374151; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.empty-state p { font-size: 13px; color: var(--grey); margin: 0; }

.loading-card {
    background: #fff;
    border-radius: 16px;
    padding: 60px 20px;
    text-align: center;
    border: 1px solid var(--border-light);
}
.loading-spinner {
    width: 40px; height: 40px;
    border: 4px solid rgba(10,22,85,0.1);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-card p { color: var(--grey); font-size: 13px; margin: 0; }

/* ================= MODAL ================= */
.fdc-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 29, 54, 0.7);
    backdrop-filter: blur(6px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeIn 0.25s ease;
}
.fdc-modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.fdc-modal {
    background: #fff;
    border-radius: 20px;
    max-width: 780px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.fdc-modal-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    padding: 22px 24px;
    border-radius: 20px 20px 0 0;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 5;
}
.fdc-modal-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.fdc-modal-header .mh-left { display: flex; align-items: center; gap: 12px; }
.fdc-modal-header .mh-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    border: 1px solid rgba(242,210,123,0.3);
}
.fdc-modal-header h5 { margin: 0; font-size: 16px; font-weight: 700; color: #fff; }
.fdc-modal-header small { font-size: 11px; opacity: 0.85; display: block; margin-top: 2px; }

.fdc-modal-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.fdc-modal-close:hover { background: var(--danger); transform: rotate(90deg); }

.fdc-modal-body { padding: 22px 24px; }

.fdc-form-label {
    font-size: 11.5px;
    font-weight: 700;
    color: #4b5563;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
}
.fdc-form-label .req { color: var(--danger); }

.fdc-input, .fdc-select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    background: #fafbff;
    font-size: 13.5px;
    transition: 0.25s;
    outline: none;
    font-family: inherit;
}
.fdc-input:focus, .fdc-select:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.08);
    background: #fff;
}

.fdc-modal-footer {
    padding: 16px 24px 22px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-light);
    background: #fafbff;
    position: sticky;
    bottom: 0;
}

/* ================= PAPER EDITOR ================= */
.paper-editor {
    background: #fafbff;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
}
.paper-editor-header {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.paper-editor-header i { color: var(--gold-dark); }

.switch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #fff;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
}
.switch-row input[type="checkbox"] {
    width: 18px; height: 18px;
    accent-color: var(--navy);
    cursor: pointer;
}
.switch-row label {
    font-weight: 600;
    font-size: 13px;
    color: var(--dark);
    cursor: pointer;
    margin: 0;
}

.pass-hint {
    font-size: 10.5px;
    color: var(--success);
    font-weight: 700;
    margin-top: 4px;
    display: block;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    .admin-header { padding: 10px 14px; }
    .main-wrap { padding: 14px 12px 50px; }
    .page-title { font-size: 17px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .filter-card { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .section-header { padding: 10px 14px; }
    .section-header .sh-title { font-size: 13px; }
    .book-header { padding: 10px 12px; gap: 10px; }
    .book-header .bh-icon { width: 32px; height: 32px; font-size: 13px; }
    .book-header .bh-title { font-size: 13px; }
    .book-header .bh-subtitle { display: none; }
    .marks-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
    .btn-header span { display: none; }
    .filter-card { grid-template-columns: 1fr; }
    .section-header .sh-count { display: none; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="admin-header">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-book"></i></div>
        <div>
            <h4>Subject Management</h4>
            <small>বিষয় পরিচালনা</small>
        </div>
    </div>
    <div class="user-box">
        <div class="avatar-circle" data-admin-avatar>A</div>
        <a href="admin-dashboard.html" class="btn-header">
            <i class="fas fa-arrow-left"></i> <span>Dashboard</span>
        </a>
        <button class="btn-header" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </button>
    </div>
</header>

<!-- MAIN -->
<div class="main-wrap">

    <h4 class="page-title">
        <i class="fas fa-book"></i> Subject Management
    </h4>
    <p class="page-sub">HSC ও BMT-এর সব বই পরিচালনা করুন — pass marks সহ</p>

    <!-- TOOLBAR -->
    <div class="toolbar">
        <div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-secondary" id="btnExpandAll">
                <i class="fas fa-chevron-down"></i> Expand All
            </button>
            <button class="btn-secondary" id="btnCollapseAll">
                <i class="fas fa-chevron-up"></i> Collapse All
            </button>
            <button class="btn-primary-grad" id="btnAddBook">
                <i class="fas fa-plus-circle"></i> Add New Book
            </button>
        </div>
    </div>

    <!-- FILTER -->
    <div class="filter-card">
        <div>
            <label>Branch</label>
            <select id="filterBranch">
                <option value="">All Branches</option>
                <option value="HSC">HSC</option>
                <option value="BM">BM (BMT)</option>
            </select>
        </div>
        <div>
            <label>Type</label>
            <select id="filterType">
                <option value="">All Types</option>
                <option value="compulsory">Compulsory</option>
                <option value="group">Group</option>
                <option value="optional">Optional</option>
            </select>
        </div>
        <div>
            <label>Status</label>
            <select id="filterStatus">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
        <div>
            <label>Search</label>
            <input type="text" id="searchInput" placeholder="Book name / code...">
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-row">
        <div class="stat-pill">
            <div class="sp-icon navy"><i class="fas fa-book"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statBooks">0</div>
                <div class="sp-label">Books</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon blue"><i class="fas fa-file-alt"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statPapers">0</div>
                <div class="sp-label">Papers</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon gold"><i class="fas fa-flask"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statHSC">0</div>
                <div class="sp-label">HSC</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon purple"><i class="fas fa-briefcase"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statBM">0</div>
                <div class="sp-label">BM</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon green"><i class="fas fa-check-circle"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statActive">0</div>
                <div class="sp-label">Active</div>
            </div>
        </div>
    </div>

    <!-- CONTAINER -->
    <div id="subjectsContainer">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <p>Subjects লোড হচ্ছে...</p>
        </div>
    </div>

</div>

<!-- ================================================== -->
<!-- MODAL: Add/Edit Book -->
<!-- ================================================== -->
<div class="fdc-modal-overlay" id="bookModal">
    <div class="fdc-modal">
        <div class="fdc-modal-header">
            <div class="mh-left">
                <div class="mh-icon"><i class="fas fa-book" id="bookModalIcon"></i></div>
                <div>
                    <h5 id="bookModalTitle">Add New Book</h5>
                    <small id="bookModalSub">নতুন বই যোগ করুন</small>
                </div>
            </div>
            <button class="fdc-modal-close" id="closeBookModal">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="fdc-modal-body">
            <input type="hidden" id="editBookKey" value="">
            <input type="hidden" id="editPaperIds" value="">

            <div class="row g-3">

                <div class="col-12">
                    <label class="fdc-form-label">Book Name <span class="req">*</span></label>
                    <input type="text" class="fdc-input" id="bookName" placeholder="যেমন: পদার্থবিজ্ঞান">
                </div>

                <div class="col-md-4">
                    <label class="fdc-form-label">Branch <span class="req">*</span></label>
                    <select class="fdc-select" id="bookBranch">
                        <option value="">Select</option>
                        <option value="HSC">HSC</option>
                        <option value="BM">BM (BMT)</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="fdc-form-label">Class <span class="req">*</span></label>
                    <select class="fdc-select" id="bookClass">
                        <option value="">Select</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="fdc-form-label">Group</label>
                    <select class="fdc-select" id="bookGroup">
                        <option value="">None</option>
                        <option value="Science">Science</option>
                        <option value="Humanities">Humanities</option>
                        <option value="Business">Business</option>
                        <option value="BM-General">BM-General</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="fdc-form-label">Subject Type <span class="req">*</span></label>
                    <select class="fdc-select" id="bookType">
                        <option value="">Select</option>
                        <option value="compulsory">Compulsory</option>
                        <option value="group">Group</option>
                        <option value="optional">Optional</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="fdc-form-label">Assessment Model <span class="req">*</span></label>
                    <select class="fdc-select" id="bookModel">
                        <option value="cq_mcq_practical">CQ / MCQ / Practical (HSC)</option>
                        <option value="board_continuous">Board + Continuous (BMT)</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="fdc-form-label">Paper Count <span class="req">*</span></label>
                    <select class="fdc-select" id="bookPaperCount">
                        <option value="1">1 Paper (Single)</option>
                        <option value="2" selected>2 Papers</option>
                    </select>
                </div>

                <!-- PAPER 1 -->
                <div class="col-12" id="paper1Block">
                    <div class="paper-editor">
                        <div class="paper-editor-header">
                            <i class="fas fa-file-alt"></i>
                            <span>১ম পত্র (Paper 1)</span>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label class="fdc-form-label">Subject Code</label>
                                <input type="text" class="fdc-input" id="p1Code" placeholder="174">
                            </div>
                            <div class="col-md-3">
                                <label class="fdc-form-label">CQ / Board</label>
                                <input type="number" class="fdc-input" id="p1CQ" placeholder="50" min="0">
                            </div>
                            <div class="col-md-3">
                                <label class="fdc-form-label">MCQ / Continuous</label>
                                <input type="number" class="fdc-input" id="p1MCQ" placeholder="25" min="0">
                            </div>
                            <div class="col-md-3">
                                <label class="fdc-form-label">Practical</label>
                                <input type="number" class="fdc-input" id="p1Practical" placeholder="25" min="0">
                            </div>
                        </div>
                        <div class="row g-2 mt-2">
                            <div class="col-md-4">
                                <div class="switch-row">
                                    <input type="checkbox" id="p1HasCQ" checked>
                                    <label for="p1HasCQ">Has CQ</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="switch-row">
                                    <input type="checkbox" id="p1HasMCQ" checked>
                                    <label for="p1HasMCQ">Has MCQ</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="switch-row">
                                    <input type="checkbox" id="p1HasPractical">
                                    <label for="p1HasPractical">Has Practical</label>
                                </div>
                            </div>
                        </div>
                        <span class="pass-hint" id="p1PassHint"></span>
                    </div>
                </div>

                <!-- PAPER 2 -->
                <div class="col-12" id="paper2Block">
                    <div class="paper-editor">
                        <div class="paper-editor-header">
                            <i class="fas fa-file-alt"></i>
                            <span>২য় পত্র (Paper 2)</span>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label class="fdc-form-label">Subject Code</label>
                                <input type="text" class="fdc-input" id="p2Code" placeholder="175">
                            </div>
                            <div class="col-md-3">
                                <label class="fdc-form-label">CQ / Board</label>
                                <input type="number" class="fdc-input" id="p2CQ" placeholder="50" min="0">
                            </div>
                            <div class="col-md-3">
                                <label class="fdc-form-label">MCQ / Continuous</label>
                                <input type="number" class="fdc-input" id="p2MCQ" placeholder="25" min="0">
                            </div>
                            <div class="col-md-3">
                                <label class="fdc-form-label">Practical</label>
                                <input type="number" class="fdc-input" id="p2Practical" placeholder="25" min="0">
                            </div>
                        </div>
                        <div class="row g-2 mt-2">
                            <div class="col-md-4">
                                <div class="switch-row">
                                    <input type="checkbox" id="p2HasCQ" checked>
                                    <label for="p2HasCQ">Has CQ</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="switch-row">
                                    <input type="checkbox" id="p2HasMCQ" checked>
                                    <label for="p2HasMCQ">Has MCQ</label>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="switch-row">
                                    <input type="checkbox" id="p2HasPractical">
                                    <label for="p2HasPractical">Has Practical</label>
                                </div>
                            </div>
                        </div>
                        <span class="pass-hint" id="p2PassHint"></span>
                    </div>
                </div>

                <!-- ACTIVE -->
                <div class="col-12">
                    <div class="switch-row">
                        <input type="checkbox" id="bookIsActive" checked>
                        <label for="bookIsActive">Active (students can select this book)</label>
                    </div>
                </div>

            </div>
        </div>

        <div class="fdc-modal-footer">
            <button class="btn-secondary" id="cancelBookBtn">
                <i class="fas fa-times"></i> Cancel
            </button>
            <button class="btn-primary-grad" id="saveBookBtn">
                <i class="fas fa-save"></i> Save Book
            </button>
        </div>
    </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-popup.js?v=2"></script>
<script src="../js/admin-subjects.js?v=4"></script>

</body>
</html>
