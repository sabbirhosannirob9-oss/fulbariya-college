<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Management - Fulbariya College</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0a1655;
    --navy-2: #1a237e;
    --navy-3: #0d47a1;
    --gold: #f2d27b;
    --gold-2: #d4af37;
    --gold-dark: #b8941f;
    --white: #ffffff;
    --off-white: #f8f9fc;
    --grey: #6b7280;
    --dark: #1f2937;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --border: rgba(0,0,0,0.06);
    --border-light: rgba(0,0,0,0.04);
    --shadow-sm: 0 1px 3px rgba(10,22,85,0.06);
    --shadow-md: 0 4px 16px rgba(10,22,85,0.08);
    --shadow-lg: 0 12px 40px rgba(10,22,85,0.12);
}

* { font-family: 'Hind Siliguri', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--off-white); margin: 0; color: var(--dark); }

/* HEADER */
.admin-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 20px rgba(10,22,85,0.2);
    flex-wrap: wrap;
    gap: 12px;
}
.admin-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.admin-header .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.admin-header .brand-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    border: 1px solid rgba(242,210,123,0.3);
    flex-shrink: 0;
}
.admin-header h4 { margin: 0; font-size: 16px; font-weight: 700; }
.admin-header small { font-size: 10.5px; opacity: 0.85; display: block; margin-top: 2px; }
.admin-header .user-box { display: flex; align-items: center; gap: 8px; }
.avatar-circle {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
    border: 2px solid rgba(242,210,123,0.4);
    flex-shrink: 0;
    overflow: hidden;
}
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.btn-header {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
}
.btn-header:hover { background: rgba(255,255,255,0.25); color: #fff; transform: translateY(-1px); }

/* MAIN */
.main-wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }

.page-title {
    color: var(--navy);
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.page-title i { color: var(--gold-dark); }
.page-title .badge-total {
    background: linear-gradient(135deg, rgba(10,22,85,0.08), rgba(13,71,161,0.06));
    color: var(--navy);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 700;
    border: 1px solid rgba(10,22,85,0.1);
}
.page-sub { color: var(--grey); font-size: 12.5px; margin-bottom: 18px; }

/* TOOLBAR */
.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}
.toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn-primary-grad {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 4px 16px rgba(10,22,85,0.25);
    display: inline-flex;
    align-items: center;
    gap: 7px;
}
.btn-primary-grad:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,22,85,0.35); color: #fff; }
.btn-primary-grad i { color: var(--gold); }

.btn-secondary {
    background: #fff;
    color: var(--navy);
    border: 1.5px solid #e5e7eb;
    padding: 10px 18px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.btn-secondary:hover { border-color: var(--navy); background: #f5f7ff; }

/* STATS */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
}
.stat-pill {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
}
.stat-pill .sp-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
}
.stat-pill .sp-icon.navy { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--gold); }
.stat-pill .sp-icon.gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: var(--navy); }
.stat-pill .sp-icon.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.stat-pill .sp-icon.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
.stat-pill .sp-info { min-width: 0; }
.stat-pill .sp-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
    font-family: 'Playfair Display', serif;
}
.stat-pill .sp-label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 3px;
}

/* FILTER */
.filter-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
}
.filter-card label {
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
    margin-bottom: 4px;
}
.filter-card select,
.filter-card input {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    background: #fafbff;
    font-size: 13px;
    outline: none;
    transition: 0.25s;
    font-family: inherit;
}
.filter-card select:focus,
.filter-card input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.06);
    background: #fff;
}

/* TABLE */
.table-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    overflow: hidden;
}
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.subject-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 900px;
}
.subject-table thead {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    color: #fff;
}
.subject-table thead th {
    padding: 12px 12px;
    text-align: left;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
}
.subject-table thead th:last-child { text-align: center; width: 130px; }

.subject-table tbody tr {
    border-bottom: 1px solid var(--border-light);
    transition: 0.2s;
}
.subject-table tbody tr:hover { background: #fafbff; }
.subject-table tbody td {
    padding: 11px 12px;
    vertical-align: middle;
    color: var(--dark);
}
.subject-table tbody td:last-child { text-align: center; }

.subject-name-cell {
    font-weight: 600;
    color: var(--navy);
    font-size: 13.5px;
}
.subject-name-cell small {
    display: block;
    font-size: 10.5px;
    color: var(--grey);
    font-weight: 500;
    margin-top: 2px;
}
.subject-code {
    display: inline-block;
    background: rgba(10,22,85,0.06);
    color: var(--navy);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 10.5px;
    font-weight: 700;
    margin-right: 6px;
}

.type-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
}
.type-tag.compulsory { background: #dbeafe; color: #1e40af; }
.type-tag.group { background: #dcfce7; color: #166534; }
.type-tag.optional { background: #fef3c7; color: #92400e; }

.branch-tag {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}
.branch-tag.HSC { background: rgba(10,22,85,0.08); color: var(--navy); }
.branch-tag.BM { background: rgba(139,92,246,0.12); color: #6b21a8; }

.marks-info {
    font-size: 11.5px;
    color: var(--grey);
    font-weight: 600;
}
.marks-info span {
    display: inline-block;
    background: #f3f4f6;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 3px;
    color: var(--dark);
    font-weight: 700;
}

.action-btns {
    display: inline-flex;
    gap: 5px;
    justify-content: center;
}
.action-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.action-btn:hover { transform: scale(1.1); }
.action-btn.edit { background: #e3f2fd; color: #1565c0; }
.action-btn.toggle { background: #dcfce7; color: #166534; }
.action-btn.toggle.off { background: #fef2f2; color: #dc2626; }

/* Empty state */
.empty-state {
    text-align: center;
    padding: 60px 20px;
}
.empty-state .icon-wrap {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, rgba(10,22,85,0.06), rgba(13,71,161,0.04));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
}
.empty-state i { font-size: 36px; color: var(--navy); opacity: 0.35; }
.empty-state h6 { color: #374151; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.empty-state p { font-size: 13px; color: var(--grey); margin: 0; }

/* Pagination */
.pagination-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-top: 1px solid var(--border-light);
    background: #fafbff;
    flex-wrap: wrap;
    gap: 10px;
}
.pagination-info { font-size: 12px; color: var(--grey); }
.pagination-btns { display: flex; gap: 5px; flex-wrap: wrap; }
.page-btn {
    min-width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1.5px solid #e5e7eb;
    background: #fff;
    color: var(--dark);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    padding: 0 10px;
}
.page-btn:hover:not(:disabled) { border-color: var(--navy); color: var(--navy); }
.page-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* MODAL */
.fdc-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 29, 54, 0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeIn 0.25s ease;
}
.fdc-modal-overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.fdc-modal {
    background: #fff;
    border-radius: 20px;
    max-width: 720px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    position: relative;
    animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.fdc-modal-header {
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
    padding: 22px 24px;
    border-radius: 20px 20px 0 0;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 5;
}
.fdc-modal-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.fdc-modal-header .mh-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fdc-modal-header .mh-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(242,210,123,0.15);
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    border: 1px solid rgba(242,210,123,0.3);
}
.fdc-modal-header h5 { margin: 0; font-size: 16px; font-weight: 700; color: #fff; }
.fdc-modal-header small { font-size: 11px; opacity: 0.85; display: block; margin-top: 2px; }

.fdc-modal-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: 0.25s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.fdc-modal-close:hover { background: var(--danger); transform: rotate(90deg); }

.fdc-modal-body { padding: 22px 24px; }

.fdc-form-label {
    font-size: 11.5px;
    font-weight: 700;
    color: #4b5563;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    display: block;
}
.fdc-form-label .req { color: var(--danger); }
.fdc-form-label .opt { color: var(--grey); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 10.5px; }

.fdc-input, .fdc-select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    background: #fafbff;
    font-size: 13.5px;
    transition: 0.25s;
    outline: none;
    font-family: inherit;
}
.fdc-input:focus, .fdc-select:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(10,22,85,0.08);
    background: #fff;
}

.switch-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #fafbff;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
}
.switch-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--navy);
    cursor: pointer;
}
.switch-row label {
    font-weight: 600;
    font-size: 13px;
    color: var(--dark);
    cursor: pointer;
    margin: 0;
}

.fdc-modal-footer {
    padding: 16px 24px 22px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-light);
    background: #fafbff;
    position: sticky;
    bottom: 0;
}

/* Responsive */
@media (max-width: 768px) {
    .admin-header { padding: 10px 14px; }
    .admin-header h4 { font-size: 14px; }
    .main-wrap { padding: 14px 12px 50px; }
    .page-title { font-size: 17px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-actions { justify-content: center; }
    .filter-card { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-pill { padding: 11px 12px; }
    .stat-pill .sp-value { font-size: 17px; }
    .fdc-modal-header { padding: 18px 18px; }
    .fdc-modal-body { padding: 18px 18px; }
    .fdc-modal-footer { padding: 14px 18px 18px; }
    .fdc-modal-header h5 { font-size: 14px; }
}
@media (max-width: 480px) {
    .btn-header span { display: none; }
    .filter-card { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="admin-header">
    <div class="brand">
        <div class="brand-icon"><i class="fas fa-book"></i></div>
        <div>
            <h4>Subject Management</h4>
            <small>বিষয় পরিচালনা</small>
        </div>
    </div>
    <div class="user-box">
        <div class="avatar-circle" data-admin-avatar>A</div>
        <a href="admin-dashboard.html" class="btn-header">
            <i class="fas fa-arrow-left"></i> <span>Dashboard</span>
        </a>
        <button class="btn-header" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </button>
    </div>
</header>

<!-- MAIN -->
<div class="main-wrap">

    <!-- Toolbar -->
    <div class="toolbar">
        <div>
            <h4 class="page-title">
                <i class="fas fa-book"></i> Subjects
                <span class="badge-total" id="totalSubjects">0</span>
            </h4>
            <p class="page-sub">HSC ও BM-এর সব বিষয় পরিচালনা করুন</p>
        </div>
        <div class="toolbar-actions">
            <button class="btn-primary-grad" id="btnAddSubject">
                <i class="fas fa-plus-circle"></i> Add New Subject
            </button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-pill">
            <div class="sp-icon navy"><i class="fas fa-book"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statTotal">0</div>
                <div class="sp-label">Total</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon gold"><i class="fas fa-flask"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statHSC">0</div>
                <div class="sp-label">HSC</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon purple"><i class="fas fa-briefcase"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statBM">0</div>
                <div class="sp-label">BM</div>
            </div>
        </div>
        <div class="stat-pill">
            <div class="sp-icon green"><i class="fas fa-check-circle"></i></div>
            <div class="sp-info">
                <div class="sp-value" id="statActive">0</div>
                <div class="sp-label">Active</div>
            </div>
        </div>
    </div>

    <!-- Filter -->
    <div class="filter-card">
        <div>
            <label>Branch</label>
            <select id="filterBranch">
                <option value="">All Branches</option>
                <option value="HSC">HSC</option>
                <option value="BM">BM</option>
            </select>
        </div>
        <div>
            <label>Class</label>
            <select id="filterClass">
                <option value="">All Classes</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>
        </div>
        <div>
            <label>Group</label>
            <select id="filterGroup">
                <option value="">All Groups</option>
                <option value="Science">Science</option>
                <option value="Humanities">Humanities</option>
                <option value="Business">Business</option>
                <option value="BM-General">BM-General</option>
            </select>
        </div>
        <div>
            <label>Type</label>
            <select id="filterType">
                <option value="">All Types</option>
                <option value="compulsory">Compulsory</option>
                <option value="group">Group</option>
                <option value="optional">Optional</option>
            </select>
        </div>
        <div>
            <label>Search</label>
            <input type="text" id="searchInput" placeholder="Subject name / code...">
        </div>
    </div>

    <!-- Table -->
    <div class="table-card">
        <div class="table-scroll">
            <table class="subject-table">
                <thead>
                    <tr>
                        <th style="width:50px;">SL</th>
                        <th>Subject</th>
                        <th>Branch</th>
                        <th>Class</th>
                        <th>Group</th>
                        <th>Type</th>
                        <th>Paper</th>
                        <th>Marks</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="subjectTableBody">
                    <tr><td colspan="10" style="padding:20px;text-align:center;">
                        <div style="color:var(--grey);font-size:13px;">লোড হচ্ছে...</div>
                    </td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination-wrap" id="paginationWrap" style="display:none;">
            <div class="pagination-info" id="paginationInfo"></div>
            <div class="pagination-btns" id="paginationBtns"></div>
        </div>
    </div>

</div>

<!-- MODAL: Add/Edit Subject -->
<div class="fdc-modal-overlay" id="subjectModal">
    <div class="fdc-modal">
        <div class="fdc-modal-header">
            <div class="mh-left">
                <div class="mh-icon"><i class="fas fa-book" id="subjectModalIcon"></i></div>
                <div>
                    <h5 id="subjectModalTitle">Add New Subject</h5>
                    <small id="subjectModalSub">বিষয়ের তথ্য পূরণ করুন</small>
                </div>
            </div>
            <button class="fdc-modal-close" id="closeSubjectModal">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="fdc-modal-body">
            <input type="hidden" id="editSubjectId" value="">

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="fdc-form-label">Subject Name <span class="req">*</span></label>
                    <input type="text" class="fdc-input" id="subjectName" placeholder="যেমন: পদার্থবিজ্ঞান">
                </div>
                <div class="col-md-4">
                    <label class="fdc-form-label">Subject Code <span class="opt">(optional)</span></label>
                    <input type="text" class="fdc-input" id="subjectCode" placeholder="174">
                </div>

                <div class="col-md-4">
                    <label class="fdc-form-label">Branch <span class="req">*</span></label>
                    <select class="fdc-select" id="subjectBranch">
                        <option value="">Select</option>
                        <option value="HSC">HSC</option>
                        <option value="BM">BM</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="fdc-form-label">Class <span class="req">*</span></label>
                    <select class="fdc-select" id="subjectClass">
                        <option value="">Select</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="fdc-form-label">Paper Number <span class="req">*</span></label>
                    <select class="fdc-select" id="subjectPaper">
                        <option value="1">1ম পত্র</option>
                        <option value="2">2য় পত্র</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="fdc-form-label">Group <span class="opt">(শুধু HSC-এর জন্য)</span></label>
                    <select class="fdc-select" id="subjectGroup">
                        <option value="">— None (Compulsory) —</option>
                        <option value="Science">Science</option>
                        <option value="Humanities">Humanities</option>
                        <option value="Business">Business</option>
                        <option value="BM-General">BM-General</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="fdc-form-label">Subject Type <span class="req">*</span></label>
                    <select class="fdc-select" id="subjectType">
                        <option value="">Select</option>
                        <option value="compulsory">Compulsory</option>
                        <option value="group">Group</option>
                        <option value="optional">Optional</option>
                    </select>
                </div>

                <div class="col-12" style="margin-top:14px;">
                    <label class="fdc-form-label" style="color:var(--navy);font-size:13px;">Marks Breakdown</label>
                </div>
                <div class="col-md-4">
                    <label class="fdc-form-label">CQ Marks</label>
                    <input type="number" class="fdc-input" id="subjectCQ" value="0" min="0">
                </div>
                <div class="col-md-4">
                    <label class="fdc-form-label">MCQ Marks</label>
                    <input type="number" class="fdc-input" id="subjectMCQ" value="0" min="0">
                </div>
                <div class="col-md-4">
                    <label class="fdc-form-label">Practical Marks</label>
                    <input type="number" class="fdc-input" id="subjectPractical" value="0" min="0">
                </div>

                <div class="col-12">
                    <div class="switch-row">
                        <input type="checkbox" id="subjectHasCQ" checked>
                        <label for="subjectHasCQ">Has CQ</label>
                    </div>
                </div>
                <div class="col-12">
                    <div class="switch-row">
                        <input type="checkbox" id="subjectHasMCQ" checked>
                        <label for="subjectHasMCQ">Has MCQ</label>
                    </div>
                </div>
                <div class="col-12">
                    <div class="switch-row">
                        <input type="checkbox" id="subjectHasPractical">
                        <label for="subjectHasPractical">Has Practical</label>
                    </div>
                </div>

                <div class="col-12" style="margin-top:14px;">
                    <label class="fdc-form-label" style="color:var(--navy);font-size:13px;">Flags</label>
                </div>
                <div class="col-md-4">
                    <div class="switch-row">
                        <input type="checkbox" id="subjectIsGroup">
                        <label for="subjectIsGroup">is_group</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="switch-row">
                        <input type="checkbox" id="subjectIsOptional">
                        <label for="subjectIsOptional">is_optional</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="switch-row">
                        <input type="checkbox" id="subjectIsOnlyOptional">
                        <label for="subjectIsOnlyOptional">শুধু optional</label>
                    </div>
                </div>

                <div class="col-12">
                    <div class="switch-row">
                        <input type="checkbox" id="subjectIsActive" checked>
                        <label for="subjectIsActive">Active</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="fdc-modal-footer">
            <button class="btn-secondary" id="cancelSubjectBtn">
                <i class="fas fa-times"></i> Cancel
            </button>
            <button class="btn-primary-grad" id="saveSubjectBtn">
                <i class="fas fa-save"></i> Save Subject
            </button>
        </div>
    </div>
</div>

<!-- SCRIPTS -->

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin-popup.js"></script>
<script src="../js/admin-subjects.js"></script>

</body>
