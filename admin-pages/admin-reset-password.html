<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password | Fulbariya Degree College</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #f2d27b;
            --gold-dark: #d8ad45;
            --gold-deep: #b8941f;
            --navy-dark: #061d36;
            --navy-mid: #0b3156;
            --success: #10b981;
            --danger: #ef4444;
            --info: #3b82f6;
            --purple: #8b5cf6;
        }

        * {
            font-family: 'Hind Siliguri', sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #061d36;
            position: relative;
            overflow-x: hidden;
        }

        /* BACKGROUND */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at top right, rgba(216, 173, 69, 0.18), transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(59, 130, 246, 0.15), transparent 50%),
                linear-gradient(135deg, #061d36 0%, #0b3156 50%, #061d36 100%);
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        .bg-shape.shape-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(242, 210, 123, 0.4), transparent 70%);
            top: -100px; right: -100px;
            animation: floatShape 12s ease-in-out infinite;
        }

        .bg-shape.shape-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3), transparent 70%);
            bottom: -150px; left: -150px;
            animation: floatShape 15s ease-in-out infinite reverse;
        }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.95); }
        }

        /* =====================================================
           CARD
        ===================================================== */
        .reset-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 44px 38px 34px;
            max-width: 460px;
            width: 100%;
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            animation: cardFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .reset-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-dark), var(--gold), transparent);
            border-radius: 32px 32px 0 0;
        }

        @keyframes cardFadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ICON */
        .icon-wrap {
            text-align: center;
            margin-bottom: 6px;
        }

        .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--navy-dark);
            font-size: 36px;
            box-shadow: 
                0 20px 50px rgba(216, 173, 69, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            position: relative;
            animation: iconPulse 2.8s infinite;
        }

        .icon-circle::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 32px;
            border: 2px solid rgba(242, 210, 123, 0.3);
            animation: ringPulse 2.8s infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.12); opacity: 0; }
        }

        /* TITLES */
        .reset-card h1 {
            margin: 24px 0 8px;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .reset-card h1 .highlight { color: var(--gold); }

        .reset-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 13.5px;
            margin: 0 0 30px;
            line-height: 1.6;
        }

        /* FORM */
        .form-group { margin-bottom: 18px; }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 9px;
            letter-spacing: 0.2px;
        }

        .form-label i {
            color: var(--gold);
            font-size: 13px;
            width: 16px;
            text-align: center;
        }

        .input-wrap { position: relative; }

        .form-control {
            background: rgba(0, 0, 0, 0.25);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            padding: 14px 16px;
            font-size: 14.5px;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            font-family: inherit;
        }

        .form-control:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .form-control:focus {
            background: rgba(0, 0, 0, 0.35);
            border-color: var(--gold);
            box-shadow: 
                0 0 0 4px rgba(242, 210, 123, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.28);
            font-weight: 400;
        }

        .password-wrap .form-control { padding-right: 48px; }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .password-toggle:hover {
            color: var(--gold);
            background: rgba(242, 210, 123, 0.1);
            border-color: rgba(242, 210, 123, 0.3);
        }

        /* PASSWORD STRENGTH */
        .strength-wrap {
            margin-top: 10px;
            display: none;
        }

        .strength-wrap.show { display: block; }

        .strength-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            gap: 3px;
        }

        .strength-segment {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            transition: 0.3s;
        }

        .strength-segment.weak { background: #ef4444; }
        .strength-segment.fair { background: #f59e0b; }
        .strength-segment.good { background: #10b981; }
        .strength-segment.strong { background: #059669; }

        .strength-text {
            font-size: 11.5px;
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        /* REQUIREMENTS */
        .requirements {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 14px;
            display: none;
        }

        .requirements.show { display: block; }

        .req-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            transition: 0.2s;
        }

        .req-item:last-child { margin-bottom: 0; }

        .req-item.met { color: #6ee7b7; }

        .req-item i {
            width: 14px;
            font-size: 11px;
        }

        .req-item.met i::before { content: '\f00c'; }

        /* ALERT */
        .alert-box {
            border-radius: 12px;
            padding: 13px 16px;
            display: none;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
            backdrop-filter: blur(10px);
        }

        .alert-box.show { display: flex; animation: shakeIn 0.4s ease; }

        @keyframes shakeIn {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.15);
            color: #ff9b9b;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .alert-box.success {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .alert-box.info {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.35);
        }

        /* BUTTON */
        .btn-reset {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--navy-dark);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 30px rgba(216, 173, 69, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            letter-spacing: 0.4px;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .btn-reset::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.6s;
        }

        .btn-reset:hover:not(:disabled)::before { left: 100%; }

        .btn-reset:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(216, 173, 69, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .btn-reset:active:not(:disabled) { transform: translateY(0); }

        .btn-reset:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* FOOTER */
        .reset-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .reset-footer a {
            color: var(--gold);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(242, 210, 123, 0.08);
            border: 1px solid rgba(242, 210, 123, 0.15);
            transition: 0.2s;
        }

        .reset-footer a:hover {
            background: rgba(242, 210, 123, 0.15);
            transform: translateY(-2px);
        }

        /* SUCCESS STATE */
        .success-state {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-state.show { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            border-radius: 30px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-size: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 20px 50px rgba(16, 185, 129, 0.4);
            animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes successPop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .success-state h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: #fff;
            margin: 0 0 12px;
            font-weight: 700;
        }

        .success-state p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.7;
            margin: 0 0 24px;
        }

        .btn-goto-login {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 14px 32px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--navy-dark);
            font-size: 14.5px;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(216, 173, 69, 0.35);
            letter-spacing: 0.4px;
        }

        .btn-goto-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(216, 173, 69, 0.5);
            color: var(--navy-dark);
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            body { padding: 14px; }
            .reset-card { padding: 32px 24px 26px; border-radius: 26px; }
            .icon-circle { width: 76px; height: 76px; font-size: 30px; border-radius: 22px; }
            .reset-card h1 { font-size: 23px; }
            .form-control { font-size: 16px; padding: 13px 14px; }
            .btn-reset { padding: 15px; font-size: 14.5px; }
            .success-icon { width: 84px; height: 84px; font-size: 38px; }
            .success-state h2 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="reset-card">

        <!-- FORM STATE -->
        <div id="formState">

            <!-- ICON -->
            <div class="icon-wrap">
                <div class="icon-circle">
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <!-- TITLE -->
            <h1>নতুন <span class="highlight">পাসওয়ার্ড</span></h1>
            <p class="reset-subtitle">
                আপনার নতুন পাসওয়ার্ড সেট করুন
            </p>

            <!-- FORM -->
            <form id="resetForm" autocomplete="off">

                <!-- NEW PASSWORD -->
                <div class="form-group">
                    <label class="form-label" for="newPassword">
                        <i class="fas fa-lock"></i>
                        <span>নতুন পাসওয়ার্ড</span>
                    </label>
                    <div class="input-wrap password-wrap">
                        <input type="password" 
                               class="form-control" 
                               id="newPassword"
                               placeholder="নতুন পাসওয়ার্ড দিন"
                               autocomplete="new-password"
                               required>
                        <button type="button" 
                                class="password-toggle" 
                                data-target="newPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <!-- Strength -->
                    <div class="strength-wrap" id="strengthWrap">
                        <div class="strength-bar">
                            <div class="strength-segment" id="seg1"></div>
                            <div class="strength-segment" id="seg2"></div>
                            <div class="strength-segment" id="seg3"></div>
                            <div class="strength-segment" id="seg4"></div>
                        </div>
                        <div class="strength-text" id="strengthText">পাসওয়ার্ড strength</div>
                    </div>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        <i class="fas fa-lock"></i>
                        <span>পাসওয়ার্ড নিশ্চিত করুন</span>
                    </label>
                    <div class="input-wrap password-wrap">
                        <input type="password" 
                               class="form-control" 
                               id="confirmPassword"
                               placeholder="আবার পাসওয়ার্ড দিন"
                               autocomplete="new-password"
                               required>
                        <button type="button" 
                                class="password-toggle" 
                                data-target="confirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- REQUIREMENTS -->
                <div class="requirements" id="reqBox">
                    <div class="req-item" data-req="length">
                        <i class="fas fa-circle"></i>
                        <span>কমপক্ষে ৮ অক্ষর</span>
                    </div>
                    <div class="req-item" data-req="upper">
                        <i class="fas fa-circle"></i>
                        <span>একটি বড় হাতের অক্ষর (A-Z)</span>
                    </div>
                    <div class="req-item" data-req="lower">
                        <i class="fas fa-circle"></i>
                        <span>একটি ছোট হাতের অক্ষর (a-z)</span>
                    </div>
                    <div class="req-item" data-req="number">
                        <i class="fas fa-circle"></i>
                        <span>একটি সংখ্যা (0-9)</span>
                    </div>
                </div>

                <!-- ALERT -->
                <div class="alert-box" id="resetAlert"></div>

                <!-- SUBMIT -->
                <button type="submit" class="btn-reset" id="resetBtn">
                    <i class="fas fa-check-circle"></i>
                    <span id="resetBtnText">পাসওয়ার্ড আপডেট করুন</span>
                </button>

            </form>

            <!-- FOOTER -->
            <div class="reset-footer">
                <a href="admin-login.html">
                    <i class="fas fa-arrow-left"></i> Login-এ ফিরে যান
                </a>
            </div>

        </div>

        <!-- SUCCESS STATE -->
        <div class="success-state" id="successState">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2>পাসওয়ার্ড আপডেট সফল!</h2>
            <p>
                আপনার নতুন পাসওয়ার্ড সেট করা হয়েছে।<br>
                এখন নতুন পাসওয়ার্ড দিয়ে লগইন করুন।
            </p>
            <a href="admin-login.html" class="btn-goto-login">
                <i class="fas fa-sign-in-alt"></i> Login করুন
            </a>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/admin-reset-password.js"></script>

</body>
</html>
